<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>L1-KU02 · SOLID 原则测验</title>
<style>
  :root {
    --bg: #0d1117;
    --card-bg: #161b22;
    --border: #30363d;
    --text: #e6edf3;
    --text-muted: #8b949e;
    --accent: #58a6ff;
    --success: #3fb950;
    --danger: #f85149;
    --warning: #d29922;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: 2rem 1rem;
    line-height: 1.6;
  }
  .container { max-width: 720px; margin: 0 auto; }
  header { text-align: center; margin-bottom: 2rem; }
  header h1 { font-size: 1.8rem; margin-bottom: 0.5rem; }
  header h1 span { color: var(--accent); }
  header p { color: var(--text-muted); }
  .progress-bar {
    width: 100%;
    height: 6px;
    background: var(--border);
    border-radius: 3px;
    margin-bottom: 2rem;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    background: var(--accent);
    border-radius: 3px;
    transition: width 0.3s;
    width: 0%;
  }
  .question-card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 1.5rem;
    margin-bottom: 1.5rem;
    transition: border-color 0.3s;
  }
  .question-card.correct { border-color: var(--success); }
  .question-card.wrong { border-color: var(--danger); }
  .question-header {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    margin-bottom: 1rem;
  }
  .q-num {
    background: var(--accent);
    color: #fff;
    width: 28px; height: 28px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 0.85rem;
    font-weight: 600;
    flex-shrink: 0;
  }
  .q-text { font-size: 1rem; font-weight: 500; }
  .options { display: flex; flex-direction: column; gap: 0.5rem; }
  .option {
    display: flex;
    align-items: center;
    gap: 0.6rem;
    padding: 0.75rem 1rem;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    cursor: pointer;
    transition: all 0.2s;
    font-size: 0.9rem;
  }
  .option:hover { border-color: var(--accent); background: rgba(88,166,255,0.05); }
  .option.selected { border-color: var(--accent); background: rgba(88,166,255,0.1); }
  .option.correct { border-color: var(--success); background: rgba(63,185,80,0.1); }
  .option.wrong { border-color: var(--danger); background: rgba(248,81,73,0.1); }
  .option.disabled { pointer-events: none; opacity: 0.7; }
  .option-marker {
    width: 20px; height: 20px;
    border: 2px solid var(--text-muted);
    border-radius: 50%;
    flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 0.7rem;
  }
  .option.selected .option-marker { border-color: var(--accent); background: var(--accent); color: #fff; }
  .option.correct .option-marker { border-color: var(--success); background: var(--success); color: #fff; }
  .option.wrong .option-marker { border-color: var(--danger); background: var(--danger); color: #fff; }
  .feedback {
    margin-top: 0.75rem;
    padding: 0.75rem 1rem;
    border-radius: 8px;
    font-size: 0.85rem;
    display: none;
  }
  .feedback.show { display: block; }
  .feedback.correct { background: rgba(63,185,80,0.1); color: var(--success); border: 1px solid rgba(63,185,80,0.3); }
  .feedback.wrong { background: rgba(248,81,73,0.1); color: var(--danger); border: 1px solid rgba(248,81,73,0.3); }
  .result {
    text-align: center;
    padding: 2rem;
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 12px;
    display: none;
  }
  .result.show { display: block; }
  .result h2 { font-size: 1.5rem; margin-bottom: 0.5rem; }
  .result .score { font-size: 3rem; font-weight: 700; margin: 1rem 0; }
  .result .score.pass { color: var(--success); }
  .result .score.fail { color: var(--danger); }
  .btn {
    background: var(--accent);
    color: #fff;
    border: none;
    padding: 0.75rem 2rem;
    border-radius: 8px;
    cursor: pointer;
    font-size: 1rem;
    margin-top: 1rem;
    transition: background 0.2s;
  }
  .btn:hover { background: #4393e6; }
  footer {
    text-align: center;
    margin-top: 2rem;
    padding-top: 1.5rem;
    border-top: 1px solid var(--border);
    color: var(--text-muted);
    font-size: 0.8rem;
  }
  footer a { color: var(--accent); text-decoration: none; }
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>L1-KU02 · <span>SOLID 原则测验</span></h1>
    <p>5道选择题，即时判分，检验你的理解</p>
  </header>

  <div class="progress-bar"><div class="progress-fill" id="progress"></div></div>

  <div id="quiz-container"></div>

  <div class="result" id="result">
    <h2>测验完成！</h2>
    <div class="score" id="score"></div>
    <p id="score-desc"></p>
    <button class="btn" onclick="restart()">重新测验</button>
  </div>

  <footer>
    参考来源：《代码大全 第2版》Steve McConnell · 《架构整洁之道》Robert C. Martin · 腾讯云开发者社区 ·
    <a href="index.html">返回首页</a>
  </footer>
</div>

<script>
const questions = [
  {
    q: '一个类负责用户身份验证、发送邮件和生成报表。这违反了哪个 SOLID 原则？',
    options: ['开闭原则 (OCP)', '单一职责原则 (SRP)', '里氏替换原则 (LSP)', '依赖反转原则 (DIP)'],
    answer: 1,
    explanation: '单一职责原则要求一个类只负责一件事。该类承担了三个不同职责，应拆分为三个独立的类。'
  },
  {
    q: '以下哪种做法最符合开闭原则 (OCP)？',
    options: [
      '修改已有类来添加新功能',
      '通过继承或接口实现扩展，不修改已有代码',
      '将所有方法设为 public 以便外部修改',
      '使用全局变量控制行为'
    ],
    answer: 1,
    explanation: '开闭原则的核心是"对扩展开放，对修改关闭"。通过抽象和多态添加新功能，而非修改运行良好的旧代码。'
  },
  {
    q: '正方形继承长方形，重写 setWidth 时同时修改 height。这违反了哪个原则？',
    options: ['接口隔离原则 (ISP)', '依赖反转原则 (DIP)', '里氏替换原则 (LSP)', '单一职责原则 (SRP)'],
    answer: 2,
    explanation: '里氏替换原则要求子类能替换父类且行为不变。正方形改变了长方形的语义，导致替换后行为异常。'
  },
  {
    q: '一个接口包含 eat()、fly()、swim() 方法，实现类 Dog 必须实现 fly()（狗不会飞）。这违反了哪个原则？',
    options: ['开闭原则 (OCP)', '接口隔离原则 (ISP)', '里氏替换原则 (LSP)', '单一职责原则 (SRP)'],
    answer: 1,
    explanation: '接口隔离原则要求不强迫类实现它不需要的接口。应将胖接口拆分为 Eatable、Flyable、Swimmable 等小接口。'
  },
  {
    q: '高层模块 OrderService 直接 new 了一个 MySQLDao 实例。这违反了哪个原则？',
    options: ['单一职责原则 (SRP)', '开闭原则 (OCP)', '依赖反转原则 (DIP)', '里氏替换原则 (LSP)'],
    answer: 2,
    explanation: '依赖反转原则要求高层模块不依赖低层模块的具体实现，两者都应依赖抽象。应通过接口和依赖注入解耦。'
  }
];

let answered = [false, false, false, false, false];
let correctCount = 0;

function renderQuiz() {
  const container = document.getElementById('quiz-container');
  container.innerHTML = '';

  questions.forEach((q, qi) => {
    const card = document.createElement('div');
    card.className = 'question-card';
    card.id = 'card-' + qi;

    let optionsHtml = '';
    q.options.forEach((opt, oi) => {
      optionsHtml += '<div class="option" onclick="select(' + qi + ', ' + oi + ')">' +
        '<span class="option-marker">' + String.fromCharCode(65 + oi) + '</span>' +
        '<span>' + opt + '</span></div>';
    });

    card.innerHTML =
      '<div class="question-header">' +
        '<span class="q-num">' + (qi + 1) + '</span>' +
        '<span class="q-text">' + q.q + '</span>' +
      '</div>' +
      '<div class="options">' + optionsHtml + '</div>' +
      '<div class="feedback" id="feedback-' + qi + '"></div>';

    container.appendChild(card);
  });
}

function select(qi, oi) {
  if (answered[qi]) return;
  answered[qi] = true;

  const card = document.getElementById('card-' + qi);
  const options = card.querySelectorAll('.option');
  const feedback = document.getElementById('feedback-' + qi);

  options.forEach((opt, idx) => {
    opt.classList.add('disabled');
    if (idx === questions[qi].answer) {
      opt.classList.add('correct');
    } else if (idx === oi && oi !== questions[qi].answer) {
      opt.classList.add('wrong');
    }
  });

  if (oi === questions[qi].answer) {
    card.classList.add('correct');
    feedback.className = 'feedback show correct';
    feedback.textContent = '✅ 正确！' + questions[qi].explanation;
    correctCount++;
  } else {
    card.classList.add('wrong');
    feedback.className = 'feedback show wrong';
    feedback.textContent = '❌ 错误。' + questions[qi].explanation;
  }

  updateProgress();
  checkComplete();
}

function updateProgress() {
  const pct = (answered.filter(a => a).length / questions.length) * 100;
  document.getElementById('progress').style.width = pct + '%';
}

function checkComplete() {
  if (answered.every(a => a)) {
    setTimeout(showResult, 500);
  }
}

function showResult() {
  document.getElementById('quiz-container').style.display = 'none';
  document.getElementById('progress').style.display = 'none';

  const result = document.getElementById('result');
  result.classList.add('show');

  const scoreEl = document.getElementById('score');
  scoreEl.textContent = correctCount + ' / ' + questions.length;
  scoreEl.className = 'score ' + (correctCount >= 4 ? 'pass' : 'fail');

  const desc = document.getElementById('score-desc');
  if (correctCount === 5) {
    desc.textContent = '🎉 完美！你已经完全掌握 SOLID 原则！';
  } else if (correctCount >= 4) {
    desc.textContent = '👍 优秀！你对 SOLID 原则有很好的理解。';
  } else if (correctCount >= 3) {
    desc.textContent = '💪 不错！继续巩固，你会更上一层楼。';
  } else {
    desc.textContent = '📚 建议回顾学习材料，加深理解后再来挑战。';
  }
}

function restart() {
  answered = [false, false, false, false, false];
  correctCount = 0;
  document.getElementById('quiz-container').style.display = 'block';
  document.getElementById('progress').style.display = 'block';
  document.getElementById('progress').style.width = '0%';
  document.getElementById('result').classList.remove('show');
  renderQuiz();
}

renderQuiz();
</script>
</body>
</html>
