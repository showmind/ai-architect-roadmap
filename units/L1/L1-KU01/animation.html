<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>L1-KU01 · 设计模式演进动画</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0d1117;
    color: #e6edf3;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    padding: 1rem;
  }
  h1 { font-size: 1.5rem; margin-bottom: 0.5rem; }
  h1 span { color: #58a6ff; }
  .subtitle { color: #8b949e; font-size: 0.9rem; margin-bottom: 1rem; }
  #canvas-container {
    border: 1px solid #30363d;
    border-radius: 12px;
    overflow: hidden;
    margin-bottom: 1rem;
  }
  canvas { display: block; }
  .controls {
    display: flex;
    gap: 0.5rem;
    margin-bottom: 1rem;
    flex-wrap: wrap;
    justify-content: center;
  }
  .btn {
    background: #21262d;
    border: 1px solid #30363d;
    color: #e6edf3;
    padding: 0.5rem 1rem;
    border-radius: 8px;
    cursor: pointer;
    font-size: 0.85rem;
    transition: all 0.2s;
  }
  .btn:hover { background: #30363d; border-color: #58a6ff; }
  .btn.active { background: #1f6feb; border-color: #58a6ff; }
  .info {
    max-width: 640px;
    text-align: center;
    padding: 1rem;
    background: #161b22;
    border: 1px solid #30363d;
    border-radius: 12px;
    min-height: 100px;
  }
  .info h3 { font-size: 1rem; margin-bottom: 0.4rem; }
  .info p { color: #8b949e; font-size: 0.85rem; line-height: 1.5; }
  .code-compare {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 0.5rem;
    margin-top: 0.5rem;
    text-align: left;
  }
  .code-block {
    background: #0d1117;
    border: 1px solid #30363d;
    border-radius: 6px;
    padding: 0.5rem;
    font-size: 0.7rem;
    line-height: 1.4;
    overflow-x: auto;
  }
  .code-block.bad { border-color: rgba(248,81,73,0.4); }
  .code-block.good { border-color: rgba(63,185,80,0.4); }
  .code-block h4 { font-size: 0.75rem; margin-bottom: 0.3rem; }
  .code-block.bad h4 { color: #f85149; }
  .code-block.good h4 { color: #3fb950; }
  .code-block pre { color: #8b949e; white-space: pre-wrap; }
  .progress {
    display: flex;
    gap: 0.3rem;
    margin-bottom: 1rem;
  }
  .dot {
    width: 10px; height: 10px;
    border-radius: 50%;
    background: #30363d;
    transition: background 0.3s;
  }
  .dot.active { background: #58a6ff; }
  footer {
    margin-top: 1.5rem;
    color: #8b949e;
    font-size: 0.75rem;
    text-align: center;
  }
  footer a { color: #58a6ff; text-decoration: none; }
</style>
</head>
<body>
<h1>L1-KU01 · <span>设计模式演进动画</span></h1>
<p class="subtitle">从硬编码到策略+观察者模式的架构演进</p>

<div class="progress" id="progress"></div>
<div id="canvas-container"></div>

<div class="controls">
  <button class="btn active" onclick="goTo(0)">1 · 硬编码</button>
  <button class="btn" onclick="goTo(1)">2 · 策略模式</button>
  <button class="btn" onclick="goTo(2)">3 · 观察者模式</button>
  <button class="btn" onclick="goTo(3)">4 · 最终架构</button>
</div>

<div class="info" id="info">
  <h3>点击按钮或等待自动播放</h3>
  <p>展示一个支付系统如何从硬编码演化为灵活可扩展的架构</p>
</div>

<footer>
  参考来源：《Head First 设计模式》Eric Freeman · 《设计模式》GoF · javabetter.cn 设计模式系列 ·
  <a href="index.html">返回首页</a>
</footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
<script>
const stages = [
  {
    title: '阶段1：硬编码 — if-else 地狱',
    desc: '所有支付方式堆在一个方法里，每次新增都要修改已有代码。违反开闭原则（OCP）。',
    color: '#f85149',
    bad: 'function pay(type, amount) {\n  if (type === "alipay") {\n    // 支付宝逻辑50行\n  } else if (type === "wechat") {\n    // 微信逻辑60行\n  } else if (type === "card") {\n    // 银行卡逻辑70行\n  }\n  // 每加一种都要改这里！\n}',
    good: '// 问题：\n// 1. 方法越来越长\n// 2. 违反OCP\n// 3. 难以单元测试\n// 4. 风险：改A可能影响B'
  },
  {
    title: '阶段2：策略模式 — 封装变化',
    desc: '将每种支付方式封装为独立策略，通过接口统一调用。符合开闭原则，新增支付方式只需添加策略类。',
    color: '#d29922',
    bad: '// 定义策略接口\ninterface PayStrategy {\n  pay(amount);\n}\n\n// 具体策略\nclass AlipayStrategy {\n  pay(amount) { /* 支付宝逻辑 */ }\n}\nclass WechatStrategy {\n  pay(amount) { /* 微信逻辑 */ }\n}',
    good: '// 使用策略\nclass PaymentService {\n  constructor(strategy) {\n    this.strategy = strategy;\n  }\n  pay(amount) {\n    return this.strategy.pay(amount);\n  }\n}\n// 运行时切换\nnew PaymentService(new AlipayStrategy())'
  },
  {
    title: '阶段3：观察者模式 — 事件驱动',
    desc: '支付完成后需要通知：短信、邮件、日志、积分。观察者模式让这些通知逻辑与支付核心解耦。',
    color: '#3fb950',
    bad: '// 支付完成后通知\nclass PaymentService {\n  observers = [];\n  addObserver(o) {\n    this.observers.push(o);\n  }\n  pay(amount) {\n    this.strategy.pay(amount);\n    // 通知所有观察者\n    this.observers.forEach(\n      o => o.update(this.order)\n    );\n  }\n}',
    good: '// 观察者实现\nclass SmsObserver {\n  update(order) { sendSMS(); }\n}\nclass EmailObserver {\n  update(order) { sendEmail(); }\n}\nclass PointsObserver {\n  update(order) { addPoints(); }\n}\n// 动态添加/移除观察者'
  },
  {
    title: '阶段4：最终架构 — 模式协作',
    desc: '策略+观察者+工厂+门面多种模式协作：工厂创建策略，门面封装流程，观察者处理事件，适配器兼容旧系统。',
    color: '#58a6ff',
    bad: '// 最终架构全景\nPayStrategyFactory  →  创建策略\nPaymentFacade      →  封装流程\n  ├── PayStrategy  →  策略模式\n  ├── Observer     →  观察者模式\n  └── Adapter      →  适配器模式\n                     (兼容旧支付系统)',
    good: '// 架构价值：\n// ✅ 可扩展：新增支付只需加策略\n// ✅ 可测试：每个组件独立测试\n// ✅ 可维护：修改隔离不扩散\n// ✅ 可复用：观察者可组合使用'
  }
];

let currentStage = 0;
let autoPlay = true;
let autoTimer = 0;
let particles = [];
let angle = 0;

function setup() {
  const cnv = createCanvas(640, 350);
  cnv.parent('canvas-container');
  textAlign(CENTER, CENTER);
  initParticles();

  for (let i = 0; i < 4; i++) {
    const dot = document.createElement('div');
    dot.className = 'dot' + (i === 0 ? ' active' : '');
    document.getElementById('progress').appendChild(dot);
  }
  updateInfo();
}

function initParticles() {
  particles = [];
  const colors = ['#f85149', '#d29922', '#3fb950', '#58a6ff'];
  const labels = ['Alipay', 'Wechat', 'Card', 'PayPal'];
  for (let i = 0; i < 4; i++) {
    particles.push({
      x: random(80, 560),
      y: random(60, 290),
      vx: random(-0.5, 0.5),
      vy: random(-0.5, 0.5),
      r: random(18, 28),
      color: colors[i],
      label: labels[i],
      baseX: 150 + i * 110,
      baseY: 175
    });
  }
}

function draw() {
  background(13, 17, 23);
  angle += 0.02;

  const c = stages[currentStage].color;

  if (currentStage === 0) {
    drawHardcoded(c);
  } else if (currentStage === 1) {
    drawStrategy(c);
  } else if (currentStage === 2) {
    drawObserver(c);
  } else if (currentStage === 3) {
    drawFinal(c);
  }

  if (autoPlay) {
    autoTimer++;
    if (autoTimer > 240) {
      autoTimer = 0;
      goTo((currentStage + 1) % 4);
    }
  }
}

function drawHardcoded(c) {
  // Central big blob - "god method"
  noFill();
  stroke(c);
  strokeWeight(2);
  ellipse(320, 175, 120 + sin(angle * 3) * 10, 120 + sin(angle * 3) * 10);

  fill(c);
  noStroke();
  textSize(12);
  text('pay()', 320, 160);
  textSize(9);
  text('if-else Hell', 320, 180);

  // All particles crammed inside
  for (let i = 0; i < particles.length; i++) {
    const p = particles[i];
    const a = angle + i * PI / 2;
    const x = 320 + cos(a) * 40;
    const y = 175 + sin(a) * 40;

    fill(p.color);
    noStroke();
    ellipse(x, y, p.r);

    fill(0);
    textSize(8);
    text(p.label, x, y);
  }

  // Warning
  fill(248, 81, 73);
  textSize(11);
  text('❌ 所有逻辑堆在一起', 320, 310);
  text('新增支付方式要修改已有代码', 320, 328);
}

function drawStrategy(c) {
  // Strategy interface at top
  noFill();
  stroke(c);
  strokeWeight(2);
  ellipse(320, 80, 100);
  fill(c);
  noStroke();
  textSize(10);
  text('PayStrategy', 320, 75);
  textSize(8);
  text('+pay()', 320, 90);

  // Concrete strategies
  for (let i = 0; i < particles.length; i++) {
    const p = particles[i];
    const x = 120 + i * 100;
    const y = 200;

    stroke(c);
    strokeWeight(1);
    line(320, 100, x, y + 20);

    noFill();
    stroke(p.color);
    strokeWeight(1.5);
    ellipse(x, y, 60);

    fill(p.color);
    noStroke();
    textSize(9);
    text(p.label, x, y - 5);
    textSize(7);
    text('Strategy', x, y + 10);
  }

  fill(63, 185, 80);
  textSize(11);
  text('✅ 每种支付方式独立封装', 320, 300);
  text('新增支付只需添加新策略类', 320, 320);
}

function drawObserver(c) {
  // Subject in center
  noFill();
  stroke(c);
  strokeWeight(2);
  ellipse(320, 170, 80);
  fill(c);
  noStroke();
  textSize(10);
  text('Subject', 320, 165);
  textSize(8);
  text('pay()', 320, 180);

  // Observers around
  const obsColors = ['#58a6ff', '#a371f7', '#d29922', '#3fb950'];
  const obsLabels = ['SMS', 'Email', 'Log', 'Points'];

  for (let i = 0; i < 4; i++) {
    const a = angle * 0.5 + i * PI / 2 + PI / 4;
    const r = 110;
    const x = 320 + cos(a) * r;
    const y = 170 + sin(a) * r;

    stroke(c);
    strokeWeight(0.8);
    line(325, 170, x, y);

    noFill();
    stroke(obsColors[i]);
    strokeWeight(1.5);
    ellipse(x, y, 50);

    fill(obsColors[i]);
    noStroke();
    textSize(8);
    text(obsLabels[i], x, y);
  }

  fill(63, 185, 80);
  textSize(11);
  text('✅ 支付与通知解耦', 320, 310);
  text('动态添加/移除观察者', 320, 328);
}

function drawFinal(c) {
  // Central facade
  noFill();
  stroke(c);
  strokeWeight(2.5);
  ellipse(320, 170, 70);
  fill(c);
  noStroke();
  textSize(9);
  text('Payment', 320, 165);
  textSize(8);
  text('Facade', 320, 180);

  // Inner ring - strategies
  for (let i = 0; i < 3; i++) {
    const a = angle + i * PI * 2 / 3;
    const r = 60;
    const x = 320 + cos(a) * r;
    const y = 170 + sin(a) * r;

    noFill();
    stroke('#d29922');
    strokeWeight(1.5);
    ellipse(x, y, 35);

    fill('#d29922');
    noStroke();
    textSize(7);
    text('Strategy' + (i + 1), x, y);
  }

  // Outer ring - observers
  for (let i = 0; i < 4; i++) {
    const a = -angle * 0.3 + i * PI / 2 + PI / 4;
    const r = 120;
    const x = 320 + cos(a) * r;
    const y = 170 + sin(a) * r;

    noFill();
    stroke('#3fb950');
    strokeWeight(1);
    ellipse(x, y, 35);

    fill('#3fb950');
    noStroke();
    textSize(7);
    text('Obs' + (i + 1), x, y);
  }

  // Adapter on the side
  noFill();
  stroke('#a371f7');
  strokeWeight(1.5);
  rect(40, 145, 60, 50, 6);
  fill('#a371f7');
  noStroke();
  textSize(7);
  text('Adapter', 70, 165);
  text('(Legacy)', 70, 178);

  stroke('#a371f7');
  strokeWeight(1);
  line(100, 170, 290, 170);

  fill(63, 185, 80);
  textSize(11);
  text('✅ 多模式协作的优雅架构', 320, 310);
  text('策略 + 观察者 + 门面 + 适配器', 320, 328);
}

function goTo(n) {
  currentStage = n;
  autoTimer = 0;
  autoPlay = false;

  document.querySelectorAll('.btn').forEach((b, i) => {
    b.classList.toggle('active', i === n);
  });
  document.querySelectorAll('.dot').forEach((d, i) => {
    d.classList.toggle('active', i === n);
  });

  updateInfo();
}

function updateInfo() {
  const s = stages[currentStage];
  const info = document.getElementById('info');
  info.innerHTML =
    '<h3 style="color:' + s.color + '">' + s.title + '</h3>' +
    '<p>' + s.desc + '</p>' +
    '<div class="code-compare">' +
      '<div class="code-block bad"><h4>关键代码</h4><pre>' + s.bad + '</pre></div>' +
      '<div class="code-block good"><h4>核心价值</h4><pre>' + s.good + '</pre></div>' +
    '</div>';
}
</script>
</body>
</html>
