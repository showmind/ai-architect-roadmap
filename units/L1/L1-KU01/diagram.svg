<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" width="900" height="600">
  <defs>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="cGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#58a6ff;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#a371f7;stop-opacity:0.3"/>
    </linearGradient>
    <linearGradient id="sGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3fb950;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#d29922;stop-opacity:0.3"/>
    </linearGradient>
    <linearGradient id="bGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f85149;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#58a6ff;stop-opacity:0.3"/>
    </linearGradient>
  </defs>

  <rect width="900" height="600" fill="#0d1117"/>

  <!-- Title -->
  <text x="450" y="45" text-anchor="middle" fill="#e6edf3" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="22" font-weight="700">10种设计模式关系图</text>
  <text x="450" y="70" text-anchor="middle" fill="#8b949e" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="12">创建型 · 结构型 · 行为型 — 架构核心模式</text>

  <!-- Category headers -->
  <rect x="30" y="90" width="260" height="36" rx="6" fill="rgba(88,166,255,0.15)" stroke="#58a6ff" stroke-width="1"/>
  <text x="160" y="113" text-anchor="middle" fill="#58a6ff" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="14" font-weight="600">创建型 (Creational)</text>

  <rect x="310" y="90" width="260" height="36" rx="6" fill="rgba(63,185,80,0.15)" stroke="#3fb950" stroke-width="1"/>
  <text x="440" y="113" text-anchor="middle" fill="#3fb950" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="14" font-weight="600">结构型 (Structural)</text>

  <rect x="590" y="90" width="280" height="36" rx="6" fill="rgba(248,81,73,0.15)" stroke="#f85149" stroke-width="1"/>
  <text x="730" y="113" text-anchor="middle" fill="#f85149" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="14" font-weight="600">行为型 (Behavioral)</text>

  <!-- === CREATIONAL === -->
  <!-- Singleton -->
  <rect x="50" y="145" width="110" height="50" rx="8" fill="#161b22" stroke="#58a6ff" stroke-width="1.5" filter="url(#glow)"/>
  <text x="105" y="166" text-anchor="middle" fill="#58a6ff" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="11" font-weight="600">Singleton</text>
  <text x="105" y="182" text-anchor="middle" fill="#8b949e" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="9">单例</text>

  <!-- Factory -->
  <rect x="175" y="145" width="110" height="50" rx="8" fill="#161b22" stroke="#58a6ff" stroke-width="1.5" filter="url(#glow)"/>
  <text x="230" y="166" text-anchor="middle" fill="#58a6ff" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="11" font-weight="600">Factory</text>
  <text x="230" y="182" text-anchor="middle" fill="#8b949e" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="9">工厂</text>

  <!-- Builder -->
  <rect x="300" y="145" width="110" height="50" rx="8" fill="#161b22" stroke="#58a6ff" stroke-width="1.5" filter="url(#glow)"/>
  <text x="355" y="166" text-anchor="middle" fill="#58a6ff" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="11" font-weight="600">Builder</text>
  <text x="355" y="182" text-anchor="middle" fill="#8b949e" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="9">构建器</text>

  <!-- Prototype -->
  <rect x="425" y="145" width="110" height="50" rx="8" fill="#161b22" stroke="#58a6ff" stroke-width="1.5" filter="url(#glow)"/>
  <text x="480" y="166" text-anchor="middle" fill="#58a6ff" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="11" font-weight="600">Prototype</text>
  <text x="480" y="182" text-anchor="middle" fill="#8b949e" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="9">原型</text>

  <!-- === STRUCTURAL === -->
  <!-- Adapter -->
  <rect x="320" y="145" width="110" height="50" rx="8" fill="#161b22" stroke="#3fb950" stroke-width="1.5" filter="url(#glow)"/>
  <text x="375" y="166" text-anchor="middle" fill="#3fb950" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="11" font-weight="600">Adapter</text>
  <text x="375" y="182" text-anchor="middle" fill="#8b949e" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="9">适配器</text>

  <!-- Decorator -->
  <rect x="445" y="145" width="110" height="50" rx="8" fill="#161b22" stroke="#3fb950" stroke-width="1.5" filter="url(#glow)"/>
  <text x="500" y="166" text-anchor="middle" fill="#3fb950" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="11" font-weight="600">Decorator</text>
  <text x="500" y="182" text-anchor="middle" fill="#8b949e" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="9">装饰器</text>

  <!-- Facade -->
  <rect x="570" y="145" width="110" height="50" rx="8" fill="#161b22" stroke="#3fb950" stroke-width="1.5" filter="url(#glow)"/>
  <text x="625" y="166" text-anchor="middle" fill="#3fb950" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="11" font-weight="600">Facade</text>
  <text x="625" y="182" text-anchor="middle" fill="#8b949e" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="9">外观</text>

  <!-- Proxy -->
  <rect x="695" y="145" width="110" height="50" rx="8" fill="#161b22" stroke="#3fb950" stroke-width="1.5" filter="url(#glow)"/>
  <text x="750" y="166" text-anchor="middle" fill="#3fb950" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="11" font-weight="600">Proxy</text>
  <text x="750" y="182" text-anchor="middle" fill="#8b949e" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="9">代理</text>

  <!-- === BEHAVIORAL === -->
  <!-- Observer -->
  <rect x="600" y="145" width="110" height="50" rx="8" fill="#161b22" stroke="#f85149" stroke-width="1.5" filter="url(#glow)"/>
  <text x="655" y="166" text-anchor="middle" fill="#f85149" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="11" font-weight="600">Observer</text>
  <text x="655" y="182" text-anchor="middle" fill="#8b949e" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="9">观察者</text>

  <!-- Strategy -->
  <rect x="725" y="145" width="110" height="50" rx="8" fill="#161b22" stroke="#f85149" stroke-width="1.5" filter="url(#glow)"/>
  <text x="780" y="166" text-anchor="middle" fill="#f85149" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="11" font-weight="600">Strategy</text>
  <text x="780" y="182" text-anchor="middle" fill="#8b949e" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="9">策略</text>

  <!-- Connections between categories -->
  <line x1="255" y1="170" x2="310" y2="170" stroke="#30363d" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="415" y1="170" x2="440" y2="170" stroke="#30363d" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="530" y1="170" x2="560" y2="170" stroke="#30363d" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="650" y1="170" x2="690" y2="170" stroke="#30363d" stroke-width="1" stroke-dasharray="4,3"/>

  <!-- Cross-category relationships -->
  <line x1="230" y1="195" x2="320" y2="195" stroke="#8b949e" stroke-width="1" stroke-dasharray="3,3" opacity="0.5"/>
  <text x="275" y="215" text-anchor="middle" fill="#8b949e" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="8" opacity="0.6">组合</text>

  <line x1="480" y1="195" x2="570" y2="195" stroke="#8b949e" stroke-width="1" stroke-dasharray="3,3" opacity="0.5"/>
  <text x="525" y="215" text-anchor="middle" fill="#8b949e" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="8" opacity="0.6">组合</text>

  <line x1="500" y1="195" x2="600" y2="195" stroke="#8b949e" stroke-width="1" stroke-dasharray="3,3" opacity="0.5"/>
  <text x="550" y="215" text-anchor="middle" fill="#8b949e" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="8" opacity="0.6">组合</text>

  <!-- Center hub -->
  <circle cx="450" cy="350" r="50" fill="#161b22" stroke="#e6edf3" stroke-width="2" filter="url(#glow)"/>
  <text x="450" y="345" text-anchor="middle" fill="#e6edf3" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="14" font-weight="700">架构核心</text>
  <text x="450" y="363" text-anchor="middle" fill="#8b949e" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="10">模式协作</text>

  <!-- Lines from center to patterns -->
  <line x1="320" y1="195" x2="400" y2="300" stroke="#58a6ff" stroke-width="0.8" opacity="0.3"/>
  <line x1="450" y1="195" x2="450" y2="300" stroke="#3fb950" stroke-width="0.8" opacity="0.3"/>
  <line x1="600" y1="195" x2="450" y2="300" stroke="#f85149" stroke-width="0.8" opacity="0.3"/>

  <!-- Bottom: architecture usage -->
  <rect x="200" y="420" width="500" height="50" rx="10" fill="rgba(88,166,255,0.1)" stroke="#58a6ff" stroke-width="1" stroke-dasharray="6,3"/>
  <text x="450" y="440" text-anchor="middle" fill="#58a6ff" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="13" font-weight="600">Spring / JDK 中的实际应用</text>
  <text x="450" y="460" text-anchor="middle" fill="#8b949e" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="10">Spring BeanFactory (Factory) · Spring MVC Facade · MyBatis Proxy · Java HashMap (Strategy) · EventListener (Observer)</text>

  <!-- Footer -->
  <text x="450" y="560" text-anchor="middle" fill="#8b949e" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="9">参考来源：《Head First 设计模式》Eric Freeman · 《设计模式》GoF · javabetter.cn 设计模式系列</text>
</svg>