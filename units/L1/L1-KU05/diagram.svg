<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 700" width="900" height="700">
  <defs>
    <radialGradient id="centerGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#6d28d9" />
    </radialGradient>
    <linearGradient id="composeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="cohesionGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22c55e" />
      <stop offset="100%" stop-color="#16a34a" />
    </linearGradient>
    <linearGradient id="interfaceGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="dryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>
    <linearGradient id="modularGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#0891b2" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="900" height="700" fill="#0a0a0f" rx="16"/>

  <text x="450" y="45" text-anchor="middle" fill="#fff" font-size="22" font-weight="bold" font-family="sans-serif">代码复用与模块化设计 — 五大原则关系图</text>
  <text x="450" y="70" text-anchor="middle" fill="#a1a1aa" font-size="13" font-family="sans-serif">Composition → Cohesion → Interface → DRY → Modular Design</text>

  <!-- Center: 复用与模块化 -->
  <circle cx="450" cy="350" r="75" fill="url(#centerGrad)" filter="url(#glow)"/>
  <text x="450" y="342" text-anchor="middle" fill="#fff" font-size="16" font-weight="bold" font-family="sans-serif">复用与</text>
  <text x="450" y="360" text-anchor="middle" fill="#c4b5fd" font-size="16" font-weight="bold" font-family="sans-serif">模块化</text>
  <text x="450" y="378" text-anchor="middle" fill="#a78bfa" font-size="10" font-family="sans-serif">Code Reuse &amp; Modular</text>

  <!-- Connection lines -->
  <line x1="450" y1="280" x2="200" y2="140" stroke="#27272a" stroke-width="2" stroke-dasharray="6,4"/>
  <line x1="450" y1="280" x2="700" y2="140" stroke="#27272a" stroke-width="2" stroke-dasharray="6,4"/>
  <line x1="450" y1="420" x2="200" y2="560" stroke="#27272a" stroke-width="2" stroke-dasharray="6,4"/>
  <line x1="450" y1="420" x2="700" y2="560" stroke="#27272a" stroke-width="2" stroke-dasharray="6,4"/>
  <line x1="450" y1="350" x2="450" y2="560" stroke="#27272a" stroke-width="2" stroke-dasharray="6,4"/>

  <!-- 组合优于继承 (top-left) -->
  <rect x="80" y="60" width="240" height="160" rx="12" fill="url(#composeGrad)" opacity="0.9"/>
  <text x="200" y="110" text-anchor="middle" fill="#fff" font-size="20" font-weight="bold" font-family="sans-serif">🧱 组合优于继承</text>
  <text x="200" y="138" text-anchor="middle" fill="#bfdbfe" font-size="12" font-family="sans-serif">Composition Over Inheritance</text>
  <text x="200" y="162" text-anchor="middle" fill="#93c5fd" font-size="10" font-family="sans-serif">避免脆性基类 · 运行时灵活</text>
  <line x1="200" y1="220" x2="370" y2="300" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="4,3"/>
  <circle cx="365" cy="295" r="4" fill="#3b82f6"/>

  <!-- 高内聚低耦合 (top-right) -->
  <rect x="620" y="60" width="240" height="160" rx="12" fill="url(#cohesionGrad)" opacity="0.9"/>
  <text x="740" y="110" text-anchor="middle" fill="#fff" font-size="20" font-weight="bold" font-family="sans-serif">🎯 高内聚低耦合</text>
  <text x="740" y="138" text-anchor="middle" fill="#bbf7d0" font-size="12" font-family="sans-serif">High Cohesion Low Coupling</text>
  <text x="740" y="162" text-anchor="middle" fill="#86efac" font-size="10" font-family="sans-serif">模块紧密 · 模块松散</text>
  <line x1="700" y1="220" x2="540" y2="300" stroke="#22c55e" stroke-width="1.5" stroke-dasharray="4,3"/>
  <circle cx="535" cy="295" r="4" fill="#22c55e"/>

  <!-- 接口隔离 (middle-left) -->
  <rect x="40" y="320" width="240" height="160" rx="12" fill="url(#interfaceGrad)" opacity="0.9"/>
  <text x="160" y="370" text-anchor="middle" fill="#fff" font-size="20" font-weight="bold" font-family="sans-serif">🔌 接口隔离</text>
  <text x="160" y="398" text-anchor="middle" fill="#fde68a" font-size="12" font-family="sans-serif">Interface Segregation</text>
  <text x="160" y="422" text-anchor="middle" fill="#fcd34d" font-size="10" font-family="sans-serif">最小知识 · 依赖倒置</text>
  <line x1="160" y1="480" x2="390" y2="380" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="4,3"/>
  <circle cx="385" cy="375" r="4" fill="#f59e0b"/>

  <!-- DRY 深化 (middle-right) -->
  <rect x="620" y="320" width="240" height="160" rx="12" fill="url(#dryGrad)" opacity="0.9"/>
  <text x="740" y="370" text-anchor="middle" fill="#fff" font-size="20" font-weight="bold" font-family="sans-serif">📊 DRY 深化</text>
  <text x="740" y="398" text-anchor="middle" fill="#e9d5ff" font-size="12" font-family="sans-serif">DRY — Evolved</text>
  <text x="740" y="422" text-anchor="middle" fill="#c4b5fd" font-size="10" font-family="sans-serif">代码→架构→平台复用</text>
  <line x1="740" y1="480" x2="510" y2="380" stroke="#8b5cf6" stroke-width="1.5" stroke-dasharray="4,3"/>
  <circle cx="505" cy="375" r="4" fill="#8b5cf6"/>

  <!-- 模块化设计模式 (bottom-center) -->
  <rect x="330" y="560" width="240" height="100" rx="12" fill="url(#modularGrad)" opacity="0.9"/>
  <text x="450" y="600" text-anchor="middle" fill="#fff" font-size="18" font-weight="bold" font-family="sans-serif">⚙️ 模块化设计模式</text>
  <text x="450" y="628" text-anchor="middle" fill="#c7d2fe" font-size="11" font-family="sans-serif">微内核 · 插件化 · 分层架构</text>
  <line x1="410" y1="560" x2="420" y2="425" stroke="#06b6d4" stroke-width="1.5" stroke-dasharray="4,3"/>
  <circle cx="415" cy="420" r="4" fill="#06b6d4"/>

  <!-- Flow arrows between principles -->
  <path d="M 320 140 Q 380 200 450 280" stroke="#3b82f6" stroke-width="1" fill="none" stroke-dasharray="4,3" opacity="0.5"/>
  <path d="M 580 140 Q 520 200 450 280" stroke="#22c55e" stroke-width="1" fill="none" stroke-dasharray="4,3" opacity="0.5"/>
  <path d="M 160 320 Q 200 300 310 350" stroke="#f59e0b" stroke-width="1" fill="none" stroke-dasharray="4,3" opacity="0.5"/>
  <path d="M 740 320 Q 700 300 590 350" stroke="#8b5cf6" stroke-width="1" fill="none" stroke-dasharray="4,3" opacity="0.5"/>

  <!-- Bottom decorative -->
  <text x="450" y="690" text-anchor="middle" fill="#52525b" font-size="11" font-family="sans-serif">Ref: 《企业应用架构模式》Martin Fowler · Ref: 《架构整洁之道》Robert C. Martin</text>
</svg>