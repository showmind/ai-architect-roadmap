<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <radialGradient id="centerGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#6d28d9" />
    </radialGradient>
    <linearGradient id="dryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="yagniGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="kissGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22c55e" />
      <stop offset="100%" stop-color="#16a34a" />
    </linearGradient>
    <linearGradient id="socGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="800" fill="#0a0a0f" rx="16"/>

  <!-- Title -->
  <text x="400" y="50" text-anchor="middle" fill="#fff" font-size="22" font-weight="bold" font-family="sans-serif">架构思维四原则</text>
  <text x="400" y="75" text-anchor="middle" fill="#a1a1aa" font-size="13" font-family="sans-serif">Architecture Thinking — Core Principles</text>

  <!-- Center: 架构思维 -->
  <circle cx="400" cy="400" r="80" fill="url(#centerGrad)" filter="url(#glow)"/>
  <text x="400" y="392" text-anchor="middle" fill="#fff" font-size="18" font-weight="bold" font-family="sans-serif">架构思维</text>
  <text x="400" y="412" text-anchor="middle" fill="#c4b5fd" font-size="11" font-family="sans-serif">Architecture</text>

  <!-- Connection lines from center to corners -->
  <line x1="400" y1="330" x2="200" y2="180" stroke="#27272a" stroke-width="2" stroke-dasharray="6,4"/>
  <line x1="400" y1="330" x2="600" y2="180" stroke="#27272a" stroke-width="2" stroke-dasharray="6,4"/>
  <line x1="400" y1="470" x2="200" y2="620" stroke="#27272a" stroke-width="2" stroke-dasharray="6,4"/>
  <line x1="400" y1="470" x2="600" y2="620" stroke="#27272a" stroke-width="2" stroke-dasharray="6,4"/>

  <!-- DRY (top-left) -->
  <rect x="100" y="100" width="200" height="120" rx="12" fill="url(#dryGrad)" opacity="0.9"/>
  <text x="200" y="145" text-anchor="middle" fill="#fff" font-size="22" font-weight="bold" font-family="sans-serif">🔄 DRY</text>
  <text x="200" y="168" text-anchor="middle" fill="#bfdbfe" font-size="12" font-family="sans-serif">Don't Repeat Yourself</text>
  <text x="200" y="195" text-anchor="middle" fill="#93c5fd" font-size="10" font-family="sans-serif">单一知识来源</text>
  <line x1="200" y1="220" x2="320" y2="320" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="4,3"/>
  <circle cx="320" cy="315" r="4" fill="#3b82f6"/>

  <!-- YAGNI (top-right) -->
  <rect x="500" y="100" width="200" height="120" rx="12" fill="url(#yagniGrad)" opacity="0.9"/>
  <text x="600" y="145" text-anchor="middle" fill="#fff" font-size="22" font-weight="bold" font-family="sans-serif">🚫 YAGNI</text>
  <text x="600" y="168" text-anchor="middle" fill="#fde68a" font-size="12" font-family="sans-serif">You Aren't Gonna Need It</text>
  <text x="600" y="195" text-anchor="middle" fill="#fcd34d" font-size="10" font-family="sans-serif">拒绝过度设计</text>
  <line x1="600" y1="220" x2="480" y2="320" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="4,3"/>
  <circle cx="480" cy="315" r="4" fill="#f59e0b"/>

  <!-- KISS (bottom-left) -->
  <rect x="100" y="580" width="200" height="120" rx="12" fill="url(#kissGrad)" opacity="0.9"/>
  <text x="200" y="625" text-anchor="middle" fill="#fff" font-size="22" font-weight="bold" font-family="sans-serif">✨ KISS</text>
  <text x="200" y="648" text-anchor="middle" fill="#bbf7d0" font-size="12" font-family="sans-serif">Keep It Simple, Stupid</text>
  <text x="200" y="675" text-anchor="middle" fill="#86efac" font-size="10" font-family="sans-serif">简单是可靠之基</text>
  <line x1="200" y1="680" x2="340" y2="490" stroke="#22c55e" stroke-width="1.5" stroke-dasharray="4,3"/>
  <circle cx="340" cy="485" r="4" fill="#22c55e"/>

  <!-- Separation of Concerns (bottom-right) -->
  <rect x="500" y="580" width="200" height="120" rx="12" fill="url(#socGrad)" opacity="0.9"/>
  <text x="600" y="625" text-anchor="middle" fill="#fff" font-size="22" font-weight="bold" font-family="sans-serif">🧩 SOC</text>
  <text x="600" y="648" text-anchor="middle" fill="#e9d5ff" font-size="12" font-family="sans-serif">Separation of Concerns</text>
  <text x="600" y="675" text-anchor="middle" fill="#c4b5fd" font-size="10" font-family="sans-serif">单一职责·模块化</text>
  <line x1="600" y1="680" x2="460" y2="490" stroke="#8b5cf6" stroke-width="1.5" stroke-dasharray="4,3"/>
  <circle cx="460" cy="485" r="4" fill="#8b5cf6"/>

  <!-- Decorative connector lines between corners -->
  <line x1="300" y1="160" x2="500" y2="160" stroke="#27272a" stroke-width="1" stroke-dasharray="2,6"/>
  <line x1="300" y1="640" x2="500" y2="640" stroke="#27272a" stroke-width="1" stroke-dasharray="2,6"/>
  <line x1="150" y1="300" x2="150" y2="500" stroke="#27272a" stroke-width="1" stroke-dasharray="2,6"/>
  <line x1="650" y1="300" x2="650" y2="500" stroke="#27272a" stroke-width="1" stroke-dasharray="2,6"/>

  <!-- Footer text -->
  <text x="400" y="775" text-anchor="middle" fill="#52525b" font-size="11" font-family="sans-serif">Ref: 《架构整洁之道》Robert C. Martin</text>
</svg>