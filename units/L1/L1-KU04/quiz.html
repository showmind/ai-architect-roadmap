<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>架构思维测验 — AI时代的架构师养成之路</title>
  <style>
    :root {
      --bg: #0a0a0f;
      --fg: #e4e4e7;
      --accent: #3b82f6;
      --card: #18181b;
      --border: #27272a;
      --success: #22c55e;
      --danger: #ef4444;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      background: var(--bg);
      color: var(--fg);
      line-height: 1.6;
    }
    header { text-align: center; padding: 40px 20px 20px; border-bottom: 1px solid var(--border); }
    header h1 { font-size: 1.5rem; color: #fff; margin-bottom: 4px; }
    header p { color: #a1a1aa; font-size: .9rem; }

    .quiz-container { max-width: 720px; margin: 0 auto; padding: 30px 20px; }

    .progress-dots { display: flex; gap: 8px; justify-content: center; margin-bottom: 24px; }
    .q-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--border); transition: background .3s; }
    .q-dot.active { background: var(--accent); }
    .q-dot.correct { background: var(--success); }
    .q-dot.wrong { background: var(--danger); }

    .question-card { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 24px; }
    .question-header { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
    .question-type { font-size: .7rem; padding: 2px 8px; border-radius: 999px; }
    .question-type.single { background: rgba(59,130,246,.15); color: #60a5fa; }
    .question-type.multi { background: rgba(245,158,11,.15); color: #fbbf24; }
    .question-num { font-size: .8rem; color: #71717a; }
    .question-text { font-size: 1rem; color: #fff; margin-bottom: 16px; }

    .options { display: flex; flex-direction: column; gap: 10px; }
    .option {
      display: flex;
      gap: 12px;
      padding: 12px 14px;
      border: 1px solid var(--border);
      border-radius: 8px;
      cursor: pointer;
      transition: border-color .2s, background .2s;
    }
    .option:hover:not(.disabled) { border-color: var(--accent); background: rgba(59,130,246,.05); }
    .option.correct { border-color: var(--success); background: rgba(34,197,94,.08); }
    .option.wrong { border-color: var(--danger); background: rgba(239,68,68,.08); }
    .option.disabled { cursor: default; }
    .option-marker { flex-shrink: 0; }
    .option-letter { display: inline-flex; align-items: center; justify-content: center; width: 24px; height: 24px; border-radius: 50%; background: var(--border); font-size: .8rem; font-weight: 600; }
    .option.correct .option-letter { background: var(--success); color: #fff; }
    .option.wrong .option-letter { background: var(--danger); color: #fff; }
    .option-text { font-size: .9rem; color: #d4d4d8; }
    .option-explain { font-size: .78rem; color: #a1a1aa; margin-top: 4px; display: none; }
    .option.correct .option-explain, .option.wrong .option-explain { display: block; }

    .feedback { margin-top: 14px; padding: 10px 14px; border-radius: 8px; font-size: .85rem; display: none; }
    .feedback.correct { background: rgba(34,197,94,.08); border: 1px solid rgba(34,197,94,.3); color: #4ade80; }
    .feedback.wrong { background: rgba(239,68,68,.08); border: 1px solid rgba(239,68,68,.3); color: #f87171; }

    .result-section { text-align: center; padding: 30px 20px; display: none; }
    .result-section.show { display: block; }
    .score-number { font-size: 3rem; font-weight: 700; color: #fff; margin: 10px 0; }
    .score-comment { font-size: 1.1rem; color: #60a5fa; margin-bottom: 4px; }
    .score-sub { font-size: .85rem; color: #a1a1aa; margin-bottom: 20px; }
    .review-btn { padding: 10px 24px; background: var(--accent); color: #fff; border: none; border-radius: 8px; font-size: .9rem; cursor: pointer; }
    .review-btn:hover { background: #2563eb; }

    footer { text-align: center; padding: 18px; color: #52525b; font-size: .8rem; border-top: 1px solid var(--border); }
  </style>
</head>
<body>
  <header>
    <h1>📝 架构思维测验</h1>
    <p>检验你对 DRY、YAGNI、KISS、分离关注点的理解</p>
  </header>

  <section class="quiz-container">
    <div class="progress-dots" id="dots"></div>
    <div id="questions-container"></div>
    <div class="result-section" id="result-section">
      <div class="score-number" id="score-number">0/5</div>
      <div class="score-comment" id="comment"></div>
      <div class="score-sub" id="comment-sub"></div>
      <button class="review-btn" onclick="location.reload()">🔄 重新测验</button>
    </div>
  </section>

  <footer>Hermes-orchestrated · OpenCode · 2026</footer>

  <script>
    // 题目数据 — 使用数组索引 0-based
    const QUESTIONS = [
      {
        type: 'single',
        text: '以下哪种做法违反了 DRY（不要重复自己）原则？',
        options: [
          { letter: 'A', text: '将常用常量提取到单独的配置文件中', explain: '这是 DRY 的好实践，常量集中管理' },
          { letter: 'B', text: '在两个不同模块中复制了相同的验证逻辑', explain: '❌ 复制验证逻辑是典型违反 DRY 的做法' },
          { letter: 'C', text: '使用工具函数封装常用的字符串处理', explain: '这是 DRY 的体现，封装复用' },
          { letter: 'D', text: '通过继承复用父类的通用方法', explain: '这也是 DRY 的体现，继承复用' }
        ],
        correct: 'B'
      },
      {
        type: 'single',
        text: '你正在开发一个电商系统，只需要支持 JSON 格式的数据交换。但你创建了一个支持 JSON、XML、YAML、Protobuf 的通用解析器。这主要违反了什么原则？',
        options: [
          { letter: 'A', text: 'DRY — 不要重复自己', explain: '这里没有代码重复的问题' },
          { letter: 'B', text: 'KISS — 保持简单', explain: '虽然也有复杂化的问题，但更直接的是创造了不需要的功能' },
          { letter: 'C', text: 'YAGNI — 不要过度设计', explain: '✅ YAGNI 强调不要编写当前不需要的功能' },
          { letter: 'D', text: '分离关注点', explain: '这不是关注点混合的问题' }
        ],
        correct: 'C'
      },
      {
        type: 'single',
        text: '关于 KISS（保持简单）原则，以下哪个说法是正确的？',
        options: [
          { letter: 'A', text: 'KISS 意味着代码不能有任何抽象层', explain: 'KISS 不排斥必要的抽象，而是反对不必要的复杂' },
          { letter: 'B', text: 'KISS 要求代码行数越少越好', explain: '代码少不等于简单，有时为了可读性需要多一些代码' },
          { letter: 'C', text: 'KISS 强调设计应尽可能简单，避免不必要的复杂性', explain: '✅ KISS 的核心是避免不必要的复杂性' },
          { letter: 'D', text: 'KISS 只适用于初学者', explain: 'KISS 适用于所有级别的开发者' }
        ],
        correct: 'C'
      },
      {
        type: 'multi',
        text: '以下哪些做法体现了"分离关注点"原则？（多选）',
        options: [
          { letter: 'A', text: '将数据访问逻辑与业务逻辑放在不同的类中', explain: '✅ 数据访问和业务逻辑分离是典型的关注点分离' },
          { letter: 'B', text: '每个类只有一个引起它变化的原因', explain: '✅ 这是单一职责的表述，是分离关注点的核心' },
          { letter: 'C', text: '把所有函数放在一个文件里以便于查找', explain: '这恰恰违反了分离关注点' },
          { letter: 'D', text: '前端展示逻辑与后端 API 逻辑分别由不同团队负责', explain: '✅ 前后端分离也是关注点分离的体现' },
          { letter: 'E', text: '在一个类中同时处理用户输入验证和数据库存储', explain: '这违反了分离关注点' }
        ],
        correct: ['A', 'B', 'D']
      },
      {
        type: 'multi',
        text: '在重构一段"面条代码"时，以下哪些步骤符合正确的重构策略？（多选）',
        options: [
          { letter: 'A', text: '先写测试保护现有行为，再逐步拆分', explain: '✅ 测试保护是重构的安全网' },
          { letter: 'B', text: '一次性把所有代码重写', explain: '❌ 大爆炸式重构风险极高' },
          { letter: 'C', text: '识别代码中的职责边界，按职责拆分类', explain: '✅ 按职责拆分是正确方法' },
          { letter: 'D', text: '提取公共逻辑为独立函数/类，消除重复', explain: '✅ 消除重复是重构的核心' },
          { letter: 'E', text: '为了保持兼容性，保留所有旧接口并添加新接口', explain: '❌ 新旧并存会增加混乱' }
        ],
        correct: ['A', 'C', 'D']
      }
    ];

    let current = 0;
    const answers = {};  // 使用对象存储，key 是题目索引
    let finished = false;

    function renderQuestion() {
      if (finished) return;
      const q = QUESTIONS[current];
      const container = document.getElementById('questions-container');
      container.innerHTML = '';

      const card = document.createElement('div');
      card.className = 'question-card';

      const typeLabel = q.type === 'single' ? '单选题' : '多选题';
      const typeCls = q.type === 'single' ? 'single' : 'multi';

      let optionsHtml = '';
      q.options.forEach(opt => {
        optionsHtml += `
          <div class="option" onclick="selectOption(${current}, '${opt.letter}')">
            <div class="option-marker"><span class="option-letter">${opt.letter}</span></div>
            <div class="option-content">
              <div class="option-text">${opt.text}</div>
              <div class="option-explain">${opt.explain}</div>
            </div>
          </div>`;
      });

      card.innerHTML = `
        <div class="question-header">
          <span class="question-type ${typeCls}">${typeLabel}</span>
          <span class="question-num">第 ${current + 1} / ${QUESTIONS.length} 题</span>
        </div>
        <div class="question-text">${q.text}</div>
        <div class="options">${optionsHtml}</div>
      `;

      container.appendChild(card);
      updateDots();
    }

    function selectOption(qIdx, letter) {
      if (answers[qIdx] !== undefined) return; // 已回答

      const q = QUESTIONS[qIdx];
      const isMulti = Array.isArray(q.correct);

      if (isMulti) {
        // 多选：存储已选字母数组
        if (!answers[qIdx]) answers[qIdx] = [];
        const arr = answers[qIdx];
        const pos = arr.indexOf(letter);
        if (pos === -1) {
          arr.push(letter);
        } else {
          arr.splice(pos, 1);
        }
        // 检查是否已选够正确答案数量
        if (arr.length === q.correct.length) {
          // 检查是否全对
          const allCorrect = q.correct.every(c => arr.includes(c));
          showAnswer(qIdx, allCorrect);
        }
      } else {
        // 单选
        answers[qIdx] = letter;
        showAnswer(qIdx, letter === q.correct);
      }
    }

    function showAnswer(qIdx, isCorrect) {
      const q = QUESTIONS[qIdx];
      const card = document.querySelector('.question-card');
      const options = card.querySelectorAll('.option');

      options.forEach(opt => {
        opt.classList.add('disabled');
        const letter = opt.querySelector('.option-letter').textContent;
        if (Array.isArray(q.correct)) {
          if (q.correct.includes(letter)) opt.classList.add('correct');
          else if (answers[qIdx] && answers[qIdx].includes(letter)) opt.classList.add('wrong');
        } else {
          if (letter === q.correct) opt.classList.add('correct');
          else if (letter === answers[qIdx]) opt.classList.add('wrong');
        }
      });

      // 显示反馈
      const fb = document.createElement('div');
      fb.className = 'feedback ' + (isCorrect ? 'correct' : 'wrong');
      fb.style.display = 'block';
      fb.textContent = isCorrect ? '✅ 回答正确！' : '❌ 回答错误，正确答案已标出';
      card.appendChild(fb);

      // 延迟后进入下一题
      setTimeout(() => {
        if (current < QUESTIONS.length - 1) {
          current++;
          renderQuestion();
        } else {
          showResults();
        }
      }, 2000);
    }

    function updateDots() {
      const dotsContainer = document.getElementById('dots');
      dotsContainer.innerHTML = '';
      for (let i = 0; i < QUESTIONS.length; i++) {
        const dot = document.createElement('div');
        dot.className = 'q-dot';
        if (i === current && !finished) dot.classList.add('active');
        if (answers[i] !== undefined) {
          const q = QUESTIONS[i];
          const isMulti = Array.isArray(q.correct);
          let isCorrect;
          if (isMulti) {
            isMulti && answers[i].length === q.correct.length && q.correct.every(c => answers[i].includes(c));
            const arr = answers[i];
            isCorrect = q.correct.every(c => arr.includes(c)) && arr.length === q.correct.length;
          } else {
            isCorrect = answers[i] === q.correct;
          }
          dot.classList.add(isCorrect ? 'correct' : 'wrong');
        }
        dotsContainer.appendChild(dot);
      }
    }

    function showResults() {
      finished = true;
      let score = 0;
      QUESTIONS.forEach((q, i) => {
        if (Array.isArray(q.correct)) {
          const arr = answers[i] || [];
          if (q.correct.every(c => arr.includes(c)) && arr.length === q.correct.length) score++;
        } else {
          if (answers[i] === q.correct) score++;
        }
      });

      document.getElementById('questions-container').style.display = 'none';
      document.getElementById('dots').style.display = 'none';

      const resultSection = document.getElementById('result-section');
      resultSection.classList.add('show');
      document.getElementById('score-number').textContent = `${score}/${QUESTIONS.length}`;

      let comment, sub;
      const pct = score / QUESTIONS.length;
      if (pct >= 0.8) { comment = '🎉 架构思维达人！'; sub = '你对四大原则理解扎实，继续保持！'; }
      else if (pct >= 0.6) { comment = '👍 不错，继续努力！'; sub = '大部分概念已掌握，建议回顾薄弱部分。'; }
      else { comment = '💪 需要再接再厉！'; sub = '建议重新学习知识点章节，加深理解。'; }

      document.getElementById('comment').textContent = comment;
      document.getElementById('comment-sub').textContent = sub;
    }

    // 启动
    renderQuestion();
  </script>
</body>
</html>
