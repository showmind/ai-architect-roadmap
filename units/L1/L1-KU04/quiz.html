<!DOCTYPE html>
<html lang="zh-CN" class="theme-dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>架构思维测验 — AI时代的架构师养成之路</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../../assets/design-system.css">
</head>
<body>
  <nav class="nav">
    <div class="nav-inner">
      <a href="../../../index.html" class="nav-logo">🏗️ 架构师养成之路</a>
      <div class="nav-links">
        <a href="./index.html" class="nav-link">架构思维入门</a>
        <a href="./animation.html" class="nav-link">动画演示</a>
        <a href="./quiz.html" class="btn btn-primary" style="background:var(--accent);">📝 开始测验</a>
      </div>
    </div>
  </nav>

  <main>
    <section class="section-lg" style="text-align:center; padding-top: var(--space-9);">
      <div class="container-narrow">
        <span class="badge badge-accent" style="margin-bottom:var(--space-4);">L1-KU04 · 互动测验</span>
        <h1 class="display-hero fade-in" style="margin-bottom:var(--space-4);">架构思维测验</h1>
        <p class="body-lg text-secondary slide-up" style="max-width:500px; margin:0 auto;">5 道场景题，检验你对 DRY、YAGNI、KISS、分离关注点的理解。</p>
      </div>
    </section>

    <section class="section-sm">
      <div class="container">
        <div style="max-width:680px; margin:0 auto;">
          <!-- Progress dots -->
          <div style="display:flex; gap:8px; justify-content:center; margin-bottom:var(--space-5);" id="dots"></div>

          <div id="questions-container"></div>

          <!-- Result -->
          <div id="result-section" style="text-align:center; padding:var(--space-7) 0; display:none;">
            <div style="font-size:3rem; font-weight:700; margin-bottom:var(--space-3);" id="score-number"></div>
            <div style="font-size:1.1rem; color:var(--accent); margin-bottom:var(--space-2);" id="comment"></div>
            <div class="body-sm text-muted" style="margin-bottom:var(--space-5);" id="comment-sub"></div>
            <button class="btn btn-secondary" onclick="location.reload()">🔄 重新测验</button>
          </div>
        </div>
      </div>
    </section>
  </main>

  <footer style="text-align:center; padding:var(--space-7) var(--space-5); color:var(--text-muted); font-size:var(--text-body-sm); border-top:1px solid var(--border);">
    参考源：《代码大全2》·《架构整洁之道》Robert C. Martin · 腾讯云架构师成长路线<br>
    Hermes-orchestrated · OpenCode · 2026
  </footer>

  <script>
    const QUESTIONS = [
      {
        type: 'single',
        text: '以下哪种做法违反了 DRY（不要重复自己）原则？',
        options: [
          { letter: 'A', text: '将常用常量提取到单独的配置文件中', explain: '这是 DRY 的好实践，常量集中管理' },
          { letter: 'B', text: '在两个不同模块中复制了相同的验证逻辑', explain: '❌ 复制验证逻辑是典型违反 DRY 的做法' },
          { letter: 'C', text: '使用工具函数封装常用的字符串处理', explain: '这是 DRY 的体现，封装复用' },
          { letter: 'D', text: '通过继承复用父类的通用方法', explain: '这也是 DRY 的体现，继承复用' }
        ],
        correct: 'B'
      },
      {
        type: 'single',
        text: '你正在开发一个电商系统，只需要支持 JSON 格式的数据交换。但你创建了一个支持 JSON、XML、YAML、Protobuf 的通用解析器。这主要违反了什么原则？',
        options: [
          { letter: 'A', text: 'DRY — 不要重复自己', explain: '这里没有代码重复的问题' },
          { letter: 'B', text: 'KISS — 保持简单', explain: '虽然也有复杂化的问题，但更直接的是创造了不需要的功能' },
          { letter: 'C', text: 'YAGNI — 不要过度设计', explain: '✅ YAGNI 强调不要编写当前不需要的功能' },
          { letter: 'D', text: '分离关注点', explain: '这不是关注点混合的问题' }
        ],
        correct: 'C'
      },
      {
        type: 'single',
        text: '关于 KISS（保持简单）原则，以下哪个说法是正确的？',
        options: [
          { letter: 'A', text: 'KISS 意味着代码不能有任何抽象层', explain: 'KISS 不排斥必要的抽象，而是反对不必要的复杂' },
          { letter: 'B', text: 'KISS 要求代码行数越少越好', explain: '代码少不等于简单，有时为了可读性需要多一些代码' },
          { letter: 'C', text: 'KISS 强调设计应尽可能简单，避免不必要的复杂性', explain: '✅ KISS 的核心是避免不必要的复杂性' },
          { letter: 'D', text: 'KISS 只适用于初学者', explain: 'KISS 适用于所有级别的开发者' }
        ],
        correct: 'C'
      },
      {
        type: 'multi',
        text: '以下哪些做法体现了"分离关注点"原则？（多选）',
        options: [
          { letter: 'A', text: '将数据访问逻辑与业务逻辑放在不同的类中', explain: '✅ 数据访问和业务逻辑分离是典型的关注点分离' },
          { letter: 'B', text: '每个类只有一个引起它变化的原因', explain: '✅ 这是单一职责的表述，是分离关注点的核心' },
          { letter: 'C', text: '把所有函数放在一个文件里以便于查找', explain: '这恰恰违反了分离关注点' },
          { letter: 'D', text: '前端展示逻辑与后端 API 逻辑分别由不同团队负责', explain: '✅ 前后端分离也是关注点分离的体现' },
          { letter: 'E', text: '在一个类中同时处理用户输入验证和数据库存储', explain: '这违反了分离关注点' }
        ],
        correct: ['A', 'B', 'D']
      },
      {
        type: 'multi',
        text: '在重构一段"面条代码"时，以下哪些步骤符合正确的重构策略？（多选）',
        options: [
          { letter: 'A', text: '先写测试保护现有行为，再逐步拆分', explain: '✅ 测试保护是重构的安全网' },
          { letter: 'B', text: '一次性把所有代码重写', explain: '❌ 大爆炸式重构风险极高' },
          { letter: 'C', text: '识别代码中的职责边界，按职责拆分类', explain: '✅ 按职责拆分是正确方法' },
          { letter: 'D', text: '提取公共逻辑为独立函数/类，消除重复', explain: '✅ 消除重复是重构的核心' },
          { letter: 'E', text: '为了保持兼容性，保留所有旧接口并添加新接口', explain: '❌ 新旧并存会增加混乱' }
        ],
        correct: ['A', 'C', 'D']
      }
    ];

    let current = 0;
    const answers = {};
    let finished = false;

    function renderQuestion() {
      if (finished) return;
      const q = QUESTIONS[current];
      const container = document.getElementById('questions-container');
      container.innerHTML = '';

      const card = document.createElement('div');
      card.className = 'card';

      const typeLabel = q.type === 'single' ? '单选题' : '多选题';
      const typeCls = q.type === 'single' ? '' : '';

      let optionsHtml = '';
      q.options.forEach(opt => {
        optionsHtml += `<div class="option" onclick="selectOption(${current}, '${opt.letter}')">
          <div class="option-marker"><span class="option-letter">${opt.letter}</span></div>
          <div class="option-content">
            <div class="option-text">${opt.text}</div>
            <div class="option-explain" style="display:none; margin-top:6px; font-size:13px; color:var(--text-muted);">${opt.explain}</div>
          </div>
        </div>`;
      });

      card.innerHTML = `
        <div style="display:flex; align-items:center; gap:12px; margin-bottom:14px;">
          <span class="badge badge-accent">${typeLabel}</span>
          <span class="body-sm text-muted">第 ${current + 1} / ${QUESTIONS.length} 题</span>
        </div>
        <div class="body" style="margin-bottom:18px; color:var(--text-primary);">${q.text}</div>
        <div style="display:flex; flex-direction:column; gap:8px;">${optionsHtml}</div>
      `;

      container.appendChild(card);
      updateDots();
    }

    function selectOption(qIdx, letter) {
      if (answers[qIdx] !== undefined) return;

      const q = QUESTIONS[qIdx];
      const isMulti = Array.isArray(q.correct);

      if (isMulti) {
        if (!answers[qIdx]) answers[qIdx] = [];
        const arr = answers[qIdx];
        const pos = arr.indexOf(letter);
        if (pos === -1) arr.push(letter);
        else arr.splice(pos, 1);

        if (arr.length === q.correct.length) {
          const allCorrect = q.correct.every(c => arr.includes(c));
          showAnswer(qIdx, allCorrect);
        }
      } else {
        answers[qIdx] = letter;
        showAnswer(qIdx, letter === q.correct);
      }
    }

    function showAnswer(qIdx, isCorrect) {
      const q = QUESTIONS[qIdx];
      const card = document.querySelector('#questions-container .card');
      const options = card.querySelectorAll('.option');

      options.forEach(opt => {
        opt.classList.add('disabled');
        const letter = opt.querySelector('.option-letter').textContent;
        const explain = opt.querySelector('.option-explain');
        explain.style.display = 'block';

        if (Array.isArray(q.correct)) {
          if (q.correct.includes(letter)) opt.classList.add('correct');
          else if (answers[qIdx] && answers[qIdx].includes(letter)) opt.classList.add('wrong');
        } else {
          if (letter === q.correct) opt.classList.add('correct');
          else if (letter === answers[qIdx]) opt.classList.add('wrong');
        }
      });

      // feedback
      const fb = document.createElement('div');
      fb.className = 'badge ' + (isCorrect ? 'badge-success' : 'badge-warning');
      fb.style.marginTop = '14px';
      fb.textContent = isCorrect ? '✅ 回答正确！' : '❌ 回答错误，正确答案已标出';
      card.appendChild(fb);

      setTimeout(() => {
        if (current < QUESTIONS.length - 1) {
          current++;
          renderQuestion();
        } else {
          showResults();
        }
      }, 2200);
    }

    function updateDots() {
      const dotsContainer = document.getElementById('dots');
      dotsContainer.innerHTML = '';
      for (let i = 0; i < QUESTIONS.length; i++) {
        const dot = document.createElement('div');
        dot.style.cssText = 'width:10px; height:10px; border-radius:50%; background:var(--warm-200); transition:background .3s;';
        if (i === current && !finished) { dot.style.background = 'var(--accent)'; }
        else if (answers[i] !== undefined) {
          const q = QUESTIONS[i];
          let isCorrect;
          if (Array.isArray(q.correct)) {
            const arr = answers[i] || [];
            isCorrect = q.correct.every(c => arr.includes(c)) && arr.length === q.correct.length;
          } else {
            isCorrect = answers[i] === q.correct;
          }
          dot.style.background = isCorrect ? 'var(--success)' : 'var(--danger)';
        }
        dotsContainer.appendChild(dot);
      }
    }

    function showResults() {
      finished = true;
      let score = 0;
      QUESTIONS.forEach((q, i) => {
        if (Array.isArray(q.correct)) {
          const arr = answers[i] || [];
          if (q.correct.every(c => arr.includes(c)) && arr.length === q.correct.length) score++;
        } else {
          if (answers[i] === q.correct) score++;
        }
      });

      document.getElementById('questions-container').style.display = 'none';
      document.getElementById('dots').style.display = 'none';

      const resultSection = document.getElementById('result-section');
      resultSection.style.display = 'block';
      document.getElementById('score-number').textContent = `${score}/${QUESTIONS.length}`;

      let comment, sub;
      const pct = score / QUESTIONS.length;
      if (pct >= 0.8) { comment = '🎉 架构思维达人！'; sub = '你对四大原则理解扎实，继续保持！'; }
      else if (pct >= 0.6) { comment = '👍 不错，继续努力！'; sub = '大部分概念已掌握，建议回顾薄弱部分。'; }
      else { comment = '💪 需要再接再厉！'; sub = '建议重新学习知识点章节，加深理解。'; }

      document.getElementById('comment').textContent = comment;
      document.getElementById('comment-sub').textContent = sub;
    }

    renderQuestion();
  </script>
</body>
</html>
