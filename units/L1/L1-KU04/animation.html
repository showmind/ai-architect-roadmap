<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>架构思维动画 — AI时代的架构师养成之路</title>
  <style>
    :root { --bg: #0a0a0f; --fg: #e4e4e7; --accent: #3b82f6; --card: #18181b; --border: #27272a; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; background: var(--bg); color: var(--fg); line-height: 1.6; }
    header { text-align: center; padding: 40px 20px 20px; border-bottom: 1px solid var(--border); }
    header h1 { font-size: 1.5rem; color: #fff; }
    .animation-container { max-width: 900px; margin: 0 auto; padding: 30px 20px; }
    .canvas-wrap { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 20px; margin-bottom: 20px; text-align: center; }
    canvas { border-radius: 6px; background: #0f0f14; display: block; margin: 0 auto; }
    .stage-info { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 18px; margin-bottom: 20px; }
    .stage-info h3 { color: #60a5fa; margin-bottom: 6px; }
    .stage-info p { font-size: .88rem; color: #d4d4d8; }
    .stage-info pre { background: #0f0f14; border-radius: 6px; padding: 10px; font-size: .75rem; color: #e4e4e7; margin-top: 8px; white-space: pre-wrap; }
    .controls { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
    .ctrl-btn { padding: 8px 20px; border: 1px solid var(--border); border-radius: 6px; background: var(--card); color: var(--fg); cursor: pointer; font-size: .85rem; }
    .ctrl-btn:hover { border-color: var(--accent); color: #fff; }
    .ctrl-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }
    footer { text-align: center; padding: 18px; color: #52525b; font-size: .8rem; border-top: 1px solid var(--border); }
  </style>
</head>
<body>
  <header><h1>🎬 从面条代码到架构思维</h1></header>

  <section class="animation-container">
    <div class="canvas-wrap"><canvas id="canvas" width="800" height="340"></canvas></div>

    <div class="stage-info" id="stage-info">
      <h3 id="stage-title">准备开始</h3>
      <p id="stage-desc">点击下方按钮观看架构思维如何一步步重构混乱的代码。</p>
      <pre id="stage-code"></pre>
    </div>

    <div class="controls">
      <button class="ctrl-btn" onclick="setStage(0)">1. 混乱起点</button>
      <button class="ctrl-btn" onclick="setStage(1)">2. DRY 去重</button>
      <button class="ctrl-btn" onclick="setStage(2)">3. YAGNI 删减</button>
      <button class="ctrl-btn" onclick="setStage(3)">4. KISS 简化</button>
      <button class="ctrl-btn" onclick="setStage(4)">5. 分离关注点</button>
      <button class="ctrl-btn" onclick="togglePlay()" id="play-btn">▶ 自动播放</button>
    </div>
  </section>

  <footer>Hermes-orchestrated · OpenCode · 2026</footer>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const stages = [
      { title: '阶段 1：混乱起点 — 面条代码', desc: '所有逻辑堆在一个函数里：验证、计算、格式化、存储全混在一起。代码难读、难改、难测试。', code: 'function processEverything(data) {\n  // 验证（20行）\n  // 计算（15行）\n  // 格式化（10行）\n  // 存储（8行）\n  // 全在一个函数里！！！\n}' },
      { title: '阶段 2：DRY 去重 — 提取公共逻辑', desc: '发现多处重复的验证逻辑，提取为独立函数。每段知识只有一个权威表示。', code: 'function validate(input) { /* 唯一一份验证 */ }\nfunction process(data) {\n  validate(data);\n  // 计算、格式化各司其职\n}' },
      { title: '阶段 3：YAGNI 删减 — 删除不必要的功能', desc: '当前只用 JSON，却实现了 XML/YAML/Protobuf 解析器。删掉不需要的，只保留当前够用的。', code: '// 删掉 XML/YAML/Protobuf 解析器\nfunction parse(data) {\n  return JSON.parse(data);\n}' },
      { title: '阶段 4：KISS 简化 — 让代码一目了然', desc: '把过度抽象的层级压平，减少不必要的中间层。代码应该像在读一个故事。', code: '// 去掉多余的抽象层\nfunction calculateTotal(items) {\n  return items\n    .filter(i => i.valid)\n    .reduce((sum, i) => sum + i.price, 0);\n}' },
      { title: '阶段 5：分离关注点 — 各司其职', desc: '每个模块只负责一件事。验证、计算、存储各自独立，高内聚低耦合。', code: 'class Validator { validate(){} }\nclass Calculator { total(){} }\nclass Repository { save(){} }\n// 每个类只有一个职责' }
    ];

    let currentStage = 0;
    let playing = false;
    let playTimer = null;

    function drawStage(stageIdx) {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      const colors = ['#ef4444', '#f59e0b', '#3b82f6', '#22c55e', '#a78bfa'];
      const labels = ['混乱', '去重', '删减', '简化', '分离'];

      // 画5个方块代表5个阶段
      for (let i = 0; i < 5; i++) {
        const x = 40 + i * 155;
        const y = 80;
        const w = 130;
        const h = 160;

        // 方块背景
        ctx.fillStyle = i <= stageIdx ? colors[i] + '22' : '#18181b';
        ctx.strokeStyle = i === stageIdx ? colors[i] : '#27272a';
        ctx.lineWidth = i === stageIdx ? 2.5 : 1;
        ctx.fillRect(x, y, w, h);
        ctx.strokeRect(x, y, w, h);

        // 阶段编号圆
        ctx.beginPath();
        ctx.arc(x + w / 2, y - 20, 16, 0, Math.PI * 2);
        ctx.fillStyle = i <= stageIdx ? colors[i] : '#27272a';
        ctx.fill();
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 14px system-ui';
        ctx.textAlign = 'center';
        ctx.fillText(String(i + 1), x + w / 2, y - 15);

        // 标签
        ctx.fillStyle = i <= stageIdx ? '#e4e4e7' : '#71717a';
        ctx.font = '13px system-ui';
        ctx.fillText(labels[i], x + w / 2, y + h / 2 + 5);

        // 连接线
        if (i < 4) {
          ctx.beginPath();
          ctx.moveTo(x + w + 5, y + h / 2);
          ctx.lineTo(x + w + 20, y + h / 2);
          ctx.strokeStyle = i < stageIdx ? colors[i] : '#27272a';
          ctx.stroke();
        }
      }

      // 进度条
      ctx.fillStyle = '#27272a';
      ctx.fillRect(40, 280, 720, 6);
      ctx.fillStyle = '#3b82f6';
      ctx.fillRect(40, 280, 720 * (stageIdx + 1) / 5, 6);
      ctx.fillStyle = '#a1a1aa';
      ctx.font = '12px system-ui';
      ctx.textAlign = 'left';
      ctx.fillText('重构进度：' + (stageIdx + 1) + ' / 5', 40, 310);
    }

    function setStage(idx) {
      currentStage = idx;
      const s = stages[idx];
      document.getElementById('stage-title').textContent = s.title;
      document.getElementById('stage-desc').textContent = s.desc;
      document.getElementById('stage-code').textContent = s.code;
      drawStage(idx);

      // 更新按钮高亮
      document.querySelectorAll('.ctrl-btn').forEach((btn, i) => {
        if (i < 5) btn.classList.toggle('active', i === idx);
      });
    }

    function togglePlay() {
      playing = !playing;
      const btn = document.getElementById('play-btn');
      btn.textContent = playing ? '⏸ 暂停' : '▶ 自动播放';
      if (playing) {
        playTimer = setInterval(() => {
          currentStage = (currentStage + 1) % 5;
          setStage(currentStage);
        }, 3000);
      } else {
        clearInterval(playTimer);
      }
    }

    // 初始
    setStage(0);
  </script>
</body>
</html>
