<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 580" width="800" height="580">
  <defs>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#58a6ff;stop-opacity:0.9"/>
      <stop offset="100%" style="stop-color:#a371f7;stop-opacity:0.9"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="580" fill="#0d1117"/>

  <!-- Title -->
  <text x="400" y="44" text-anchor="middle" fill="url(#titleGrad)" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="22" font-weight="700">数据结构与算法工程应用 · 关系图</text>
  <text x="400" y="68" text-anchor="middle" fill="#8b949e" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="12">按应用场景分类：缓存与判定层 / 存储与索引层</text>

  <!-- ============ 场景区域 A：缓存与判定层 ============ -->
  <rect x="30" y="100" width="360" height="430" rx="14" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <text x="210" y="128" text-anchor="middle" fill="#58a6ff" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="14" font-weight="700">① 缓存与判定层</text>
  <text x="210" y="148" text-anchor="middle" fill="#8b949e" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="10">加速读取 · 空间换时间 · 分布式分片</text>

  <!-- HashMap -->
  <circle cx="120" cy="225" r="46" fill="#161b22" stroke="#58a6ff" stroke-width="2.5" filter="url(#glow)"/>
  <text x="120" y="220" text-anchor="middle" fill="#58a6ff" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="15" font-weight="700">HashMap</text>
  <text x="120" y="238" text-anchor="middle" fill="#8b949e" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="9">哈希表 O(1)</text>
  <text x="120" y="285" text-anchor="middle" fill="#8b949e" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="9">→ Redis Hash · 本地缓存</text>

  <!-- 布隆过滤器 -->
  <circle cx="120" cy="385" r="46" fill="#161b22" stroke="#d29922" stroke-width="2.5" filter="url(#glow)"/>
  <text x="120" y="380" text-anchor="middle" fill="#d29922" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="15" font-weight="700">布隆过滤器</text>
  <text x="120" y="398" text-anchor="middle" fill="#8b949e" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="9">判定 O(k)</text>
  <text x="120" y="445" text-anchor="middle" fill="#8b949e" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="9">→ 缓存穿透防护</text>

  <!-- 一致性哈希 -->
  <circle cx="320" cy="305" r="46" fill="#161b22" stroke="#f85149" stroke-width="2.5" filter="url(#glow)"/>
  <text x="320" y="300" text-anchor="middle" fill="#f85149" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="15" font-weight="700">一致性哈希</text>
  <text x="320" y="318" text-anchor="middle" fill="#8b949e" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="9">哈希环 O(log n)</text>
  <text x="320" y="365" text-anchor="middle" fill="#8b949e" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="9">→ 分布式缓存分片</text>

  <!-- 区域内关系：布隆过滤器 防护在 缓存(HashMap) 之前 -->
  <line x1="120" y1="271" x2="120" y2="339" stroke="#d29922" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="150" y="310" fill="#d29922" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="8" opacity="0.8">前置防护</text>

  <!-- 一致性哈希 → 分布在多个缓存节点(每个节点内含 HashMap 式缓存) -->
  <path d="M 282 305 C 240 280, 200 270, 162 250" fill="none" stroke="#f85149" stroke-width="1.3" stroke-dasharray="4,3"/>
  <text x="225" y="268" fill="#f85149" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="8" opacity="0.85">分片到各节点</text>

  <!-- ============ 场景区域 B：存储与索引层 ============ -->
  <rect x="410" y="100" width="360" height="430" rx="14" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <text x="590" y="128" text-anchor="middle" fill="#3fb950" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="14" font-weight="700">② 存储与索引层</text>
  <text x="590" y="148" text-anchor="middle" fill="#8b949e" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="10">有序存储 · 范围查询 · 磁盘友好</text>

  <!-- B+树 -->
  <circle cx="500" cy="225" r="46" fill="#161b22" stroke="#3fb950" stroke-width="2.5" filter="url(#glow)"/>
  <text x="500" y="220" text-anchor="middle" fill="#3fb950" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="15" font-weight="700">B+ 树</text>
  <text x="500" y="238" text-anchor="middle" fill="#8b949e" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="9">O(log n)</text>
  <text x="500" y="285" text-anchor="middle" fill="#8b949e" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="9">→ MySQL InnoDB 索引</text>

  <!-- 跳表 -->
  <circle cx="500" cy="385" r="46" fill="#161b22" stroke="#a371f7" stroke-width="2.5" filter="url(#glow)"/>
  <text x="500" y="380" text-anchor="middle" fill="#a371f7" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="15" font-weight="700">跳表</text>
  <text x="500" y="398" text-anchor="middle" fill="#8b949e" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="9">O(log n)</text>
  <text x="500" y="445" text-anchor="middle" fill="#8b949e" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="9">→ Redis ZSet · LSM</text>

  <!-- 区域 B 内关系：B+树 与 跳表 都是「有序/范围查询」结构 -->
  <line x1="500" y1="271" x2="500" y2="339" stroke="#a371f7" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="512" y="310" fill="#a371f7" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="8" opacity="0.85">都支持有序</text>

  <!-- ============ 跨层关系（两者都服务于「高性能架构」） ============ -->
  <path d="M 380 305 C 400 360, 410 360, 430 305" fill="none" stroke="#8b949e" stroke-width="1.3" stroke-dasharray="5,4"/>
  <text x="405" y="372" text-anchor="middle" fill="#8b949e" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="8" opacity="0.85">共筑高性能系统</text>

  <!-- 中心锚点说明：分布式缓存 = 一致性哈希 + 每节点的 HashMap 缓存 -->
  <rect x="300" y="495" width="200" height="48" rx="10" fill="#161b22" stroke="#f85149" stroke-width="1.2"/>
  <text x="400" y="513" text-anchor="middle" fill="#e6edf3" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="10" font-weight="600">典型组合：分布式缓存</text>
  <text x="400" y="530" text-anchor="middle" fill="#8b949e" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="9">一致性哈希(分片) + HashMap(节点内缓存) + 布隆(防穿透)</text>

  <!-- Footer -->
  <text x="400" y="565" text-anchor="middle" fill="#8b949e" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="9">参考来源：《算法导论》Cormen et al. · 《Redis 设计与实现》黄健宏 · javabetter.cn 数据结构系列</text>
</svg>
