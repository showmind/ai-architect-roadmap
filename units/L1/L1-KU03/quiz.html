<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>L1-KU03 · 数据结构与算法工程应用测验</title>
<style>
  :root {
    --bg: #0d1117;
    --card-bg: #161b22;
    --border: #30363d;
    --text: #e6edf3;
    --text-muted: #8b949e;
    --accent: #58a6ff;
    --success: #3fb950;
    --danger: #f85149;
    --warning: #d29922;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: 2rem 1rem;
    line-height: 1.6;
  }
  .container { max-width: 720px; margin: 0 auto; }
  header { text-align: center; margin-bottom: 2rem; }
  header h1 { font-size: 1.8rem; margin-bottom: 0.5rem; }
  header h1 span { color: var(--accent); }
  header p { color: var(--text-muted); }

  .progress-bar {
    width: 100%; height: 6px;
    background: var(--border);
    border-radius: 3px;
    margin-bottom: 2rem;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    background: var(--accent);
    border-radius: 3px;
    transition: width 0.3s;
    width: 0%;
  }

  .question-card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 1.5rem;
    margin-bottom: 1.5rem;
    transition: border-color 0.3s;
  }
  .question-card.correct { border-color: var(--success); }
  .question-card.wrong { border-color: var(--danger); }

  .question-header {
    display: flex; align-items: center; gap: 0.6rem; margin-bottom: 1rem;
  }
  .q-num {
    background: var(--accent); color: #fff;
    width: 28px; height: 28px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 0.85rem; font-weight: 600; flex-shrink: 0;
  }
  .q-text { font-size: 1rem; font-weight: 500; }
  .q-tag {
    font-size: 0.7rem; color: var(--text-muted);
    border: 1px solid var(--border); border-radius: 10px;
    padding: 0.1rem 0.5rem; margin-left: auto; white-space: nowrap;
  }

  .options { display: flex; flex-direction: column; gap: 0.5rem; }
  .option {
    display: flex; align-items: center; gap: 0.6rem;
    padding: 0.75rem 1rem;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    cursor: pointer;
    transition: all 0.2s;
    font-size: 0.9rem;
  }
  .option:hover { border-color: var(--accent); background: rgba(88,166,255,0.05); }
  .option.selected { border-color: var(--accent); background: rgba(88,166,255,0.1); }
  .option.correct { border-color: var(--success); background: rgba(63,185,80,0.1); }
  .option.wrong { border-color: var(--danger); background: rgba(248,81,73,0.1); }
  .option.disabled { pointer-events: none; opacity: 0.75; }
  .option-marker {
    width: 20px; height: 20px;
    border: 2px solid var(--text-muted);
    border-radius: 50%;
    flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 0.7rem;
  }
  .option.selected .option-marker { border-color: var(--accent); background: var(--accent); color: #fff; }
  .option.correct .option-marker { border-color: var(--success); background: var(--success); color: #fff; }
  .option.wrong .option-marker { border-color: var(--danger); background: var(--danger); color: #fff; }

  .feedback {
    margin-top: 0.75rem; padding: 0.75rem 1rem;
    border-radius: 8px; font-size: 0.85rem; display: none;
  }
  .feedback.show { display: block; }
  .feedback.correct { background: rgba(63,185,80,0.1); color: var(--success); border: 1px solid rgba(63,185,80,0.3); }
  .feedback.wrong { background: rgba(248,81,73,0.1); color: var(--danger); border: 1px solid rgba(248,81,73,0.3); }

  .result {
    text-align: center; padding: 2rem;
    background: var(--card-bg); border: 1px solid var(--border);
    border-radius: 12px; display: none;
  }
  .result.show { display: block; }
  .result h2 { font-size: 1.5rem; margin-bottom: 0.5rem; }
  .result .score { font-size: 3rem; font-weight: 700; margin: 1rem 0; }
  .result .score.pass { color: var(--success); }
  .result .score.fail { color: var(--danger); }
  .result .comment { color: var(--text-muted); font-size: 0.95rem; margin-bottom: 0.5rem; }

  .btn {
    background: var(--accent); color: #fff; border: none;
    padding: 0.75rem 2rem; border-radius: 8px; cursor: pointer;
    font-size: 1rem; margin-top: 1rem; transition: background 0.2s;
  }
  .btn:hover { background: #4393e6; }

  footer {
    text-align: center; margin-top: 2rem; padding-top: 1.5rem;
    border-top: 1px solid var(--border); color: var(--text-muted); font-size: 0.8rem;
  }
  footer a { color: var(--accent); text-decoration: none; }
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>L1-KU03 · <span>数据结构工程应用测验</span></h1>
    <p>5 道场景题，即时判分，检验你的理解</p>
  </header>

  <div class="progress-bar"><div class="progress-fill" id="progress"></div></div>

  <div id="quiz-container"></div>

  <div class="result" id="result">
    <h2>测验完成！</h2>
    <div class="score" id="score"></div>
    <p class="comment" id="score-desc"></p>
    <button class="btn" onclick="restart()">重新测验</button>
  </div>

  <footer>
    参考来源：《算法导论》Cormen et al. · 《Redis 设计与实现》黄健宏 · javabetter.cn 数据结构系列 ·
    <a href="index.html">返回首页</a>
  </footer>
</div>

<script>
// ============ 5 道场景题 ============
const questions = [
  {
    tag: 'Redis',
    q: 'Redis 的 ZSet（有序集合）在元素较多时，底层采用哪种数据结构来实现「按分数排序 + 范围查询」？',
    options: [
      '普通哈希表（Hash Table）',
      '跳表（Skip List）+ 字典',
      'B+ 树',
      '二叉搜索树（BST）'
    ],
    answer: 1,
    explanation: 'ZSet 元素多时用「跳表 + 字典」：跳表按 score 有序，支持 O(log n) 的范围/排名查询（如 ZRANGE）；字典以 O(1) 按 member 查 score。二者共享成员与分值。Redis 选跳表而非红黑树，是因为跳表范围查询更优、实现更简单、并发冲突更少。'
  },
  {
    tag: 'MySQL',
    q: 'MySQL InnoDB 的主键索引（聚簇索引）底层是 B+ 树。以下关于它的说法，哪一项是错误的？',
    options: [
      'B+ 树所有数据都存储在叶子节点，叶子节点用双向链表相连',
      '聚簇索引的叶子节点直接存放整行数据',
      '非叶子节点只存储索引 key 和指针，不存行数据',
      '进行一次主键等值查询，磁盘 IO 次数与数据总量 n 成正比（O(n)）'
    ],
    answer: 3,
    explanation: 'B+ 树是「矮胖」的多路平衡树，千万级数据通常只需 3~4 层，主键查询高度稳定为 O(log n)，而非 O(n)。叶子节点链表相连，使范围查询（如 BETWEEN、全表扫描）非常高效，这是选 B+ 树而非 Hash/二叉树的核心原因。'
  },
  {
    tag: '缓存',
    q: '某系统遭遇缓存穿透攻击：大量请求查询「数据库中根本不存在」的 key，直接击穿到 DB。最适合在缓存前加一层什么来拦截？',
    options: [
      '一致性哈希',
      'B+ 树索引',
      '布隆过滤器（Bloom Filter）',
      '跳表'
    ],
    answer: 2,
    explanation: '布隆过滤器的语义是「不存在的 key 一定不存在，存在的 key 可能误判」。把合法 key 预热进过滤器，非法 key 会被直接拒绝，从而保护数据库。它用极小空间判断「不存在」，非常适合缓存穿透防护与爬虫 URL 去重。'
  },
  {
    tag: '分布式',
    q: '一个分布式缓存集群用普通取模哈希 hash(key) % N 分片。当节点数 N 从 3 扩到 4 时，会发生什么？',
    options: [
      '只有 1/4 的数据需要迁移，其余不变',
      '几乎全部 key 的归属都会改变，需要全量重新映射',
      '数据完全不迁移，因为哈希函数没变',
      '只有新增节点上的数据需要迁移'
    ],
    answer: 1,
    explanation: '普通取模哈希对 N 极其敏感：N 从 3 变 4 后，绝大多数 key 的 hash(key)%N 结果都会变化，导致近乎全量 rehash 与数据迁移。一致性哈希用「哈希环 + 顺时针归属」解决了这个问题——节点增减只影响环上相邻的一小段数据（约 1/N）。'
  },
  {
    tag: 'Java',
    q: 'Java 8 的 HashMap 在出现哈希冲突时如何处理？当链表过长时会怎样？',
    options: [
      '直接覆盖旧值，链表不会变长',
      '用开放寻址法向后找空位',
      '链地址法追加到链表；链表长度 > 8 且容量 ≥ 64 时转为红黑树',
      '链表长度无上限，永远用链表'
    ],
    answer: 2,
    explanation: 'Java 8 HashMap 用「数组 + 链表/红黑树」的链地址法解决冲突：冲突元素追加到桶的链表；当链表长度超过 8 且数组容量 ≥ 64 时，链表转为红黑树，把最坏查找从 O(n) 优化到 O(log n)。容量取 2 的幂、负载因子 0.75 都是为了减少冲突与均摊 rehash 成本。'
  }
];

let answered = [false, false, false, false, false];
let correctCount = 0;

function renderQuiz() {
  const container = document.getElementById('quiz-container');
  container.innerHTML = '';

  questions.forEach((q, qi) => {
    const card = document.createElement('div');
    card.className = 'question-card';
    card.id = 'card-' + qi;

    let optionsHtml = '';
    q.options.forEach((opt, oi) => {
      optionsHtml += '<div class="option" onclick="select(' + qi + ', ' + oi + ')">' +
        '<span class="option-marker">' + String.fromCharCode(65 + oi) + '</span>' +
        '<span>' + opt + '</span></div>';
    });

    card.innerHTML =
      '<div class="question-header">' +
        '<span class="q-num">' + (qi + 1) + '</span>' +
        '<span class="q-text">' + q.q + '</span>' +
        '<span class="q-tag">' + q.tag + '</span>' +
      '</div>' +
      '<div class="options">' + optionsHtml + '</div>' +
      '<div class="feedback" id="feedback-' + qi + '"></div>';

    container.appendChild(card);
  });
}

function select(qi, oi) {
  if (answered[qi]) return;
  answered[qi] = true;

  const card = document.getElementById('card-' + qi);
  const options = card.querySelectorAll('.option');
  const feedback = document.getElementById('feedback-' + qi);

  options.forEach((opt, idx) => {
    opt.classList.add('disabled');
    if (idx === questions[qi].answer) {
      opt.classList.add('correct');
    } else if (idx === oi && oi !== questions[qi].answer) {
      opt.classList.add('wrong');
    }
  });

  if (oi === questions[qi].answer) {
    card.classList.add('correct');
    feedback.className = 'feedback show correct';
    feedback.textContent = '✅ 正确！' + questions[qi].explanation;
    correctCount++;
  } else {
    card.classList.add('wrong');
    feedback.className = 'feedback show wrong';
    feedback.textContent = '❌ 错误。' + questions[qi].explanation;
  }

  updateProgress();
  checkComplete();
}

function updateProgress() {
  const pct = (answered.filter(a => a).length / questions.length) * 100;
  document.getElementById('progress').style.width = pct + '%';
}

function checkComplete() {
  if (answered.every(a => a)) {
    setTimeout(showResult, 600);
  }
}

function showResult() {
  document.getElementById('quiz-container').style.display = 'none';
  document.getElementById('progress').style.display = 'none';

  const result = document.getElementById('result');
  result.classList.add('show');

  const scoreEl = document.getElementById('score');
  scoreEl.textContent = correctCount + ' / ' + questions.length;
  scoreEl.className = 'score ' + (correctCount >= 4 ? 'pass' : 'fail');

  const desc = document.getElementById('score-desc');
  if (correctCount === 5) {
    desc.textContent = '🎉 完美！你已吃透架构中的核心数据结构。';
  } else if (correctCount >= 4) {
    desc.textContent = '👍 优秀！只有一处疏漏，回顾一下错题即可。';
  } else if (correctCount >= 3) {
    desc.textContent = '💪 不错！建议再看看 HashMap 与一致性哈希的动画。';
  } else {
    desc.textContent = '📚 建议回到首页卡片，结合动画重新学习一遍。';
  }
}

function restart() {
  answered = [false, false, false, false, false];
  correctCount = 0;
  document.getElementById('quiz-container').style.display = 'block';
  document.getElementById('progress').style.display = 'block';
  document.getElementById('progress').style.width = '0%';
  document.getElementById('result').classList.remove('show');
  renderQuiz();
}

renderQuiz();
</script>
</body>
</html>
