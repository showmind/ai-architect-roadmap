<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117"/>
      <stop offset="100%" style="stop-color:#161b22"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="url(#bgGrad)"/>

  <!-- Title -->
  <text x="400" y="40" text-anchor="middle" fill="#58a6ff" font-size="22" font-family="sans-serif" font-weight="bold">CAP 定理 + BASE 理论 组合图</text>
  <text x="400" y="62" text-anchor="middle" fill="#8b949e" font-size="12" font-family="sans-serif">L2-KU001 · 分布式系统核心原理</text>

  <!-- CAP Triangle -->
  <g transform="translate(250,120)">
    <!-- Triangle outline -->
    <polygon points="150,0 0,260 300,260" fill="none" stroke="#30363d" stroke-width="2" stroke-dasharray="6,4"/>

    <!-- Vertices -->
    <circle cx="150" cy="30" r="42" fill="rgba(247,129,102,0.15)" stroke="#f78166" stroke-width="2.5" filter="url(#glow)"/>
    <text x="150" y="25" text-anchor="middle" fill="#f78166" font-size="14" font-family="sans-serif" font-weight="bold">C</text>
    <text x="150" y="42" text-anchor="middle" fill="#f78166" font-size="10" font-family="sans-serif">一致性</text>

    <circle cx="30" cy="230" r="42" fill="rgba(63,185,80,0.15)" stroke="#3fb950" stroke-width="2.5" filter="url(#glow)"/>
    <text x="30" y="225" text-anchor="middle" fill="#3fb950" font-size="14" font-family="sans-serif" font-weight="bold">A</text>
    <text x="30" y="242" text-anchor="middle" fill="#3fb950" font-size="10" font-family="sans-serif">可用性</text>

    <circle cx="270" cy="230" r="42" fill="rgba(188,140,255,0.15)" stroke="#bc8cff" stroke-width="2.5" filter="url(#glow)"/>
    <text x="270" y="225" text-anchor="middle" fill="#bc8cff" font-size="14" font-family="sans-serif" font-weight="bold">P</text>
    <text x="270" y="242" text-anchor="middle" fill="#bc8cff" font-size="10" font-family="sans-serif">分区容错</text>

    <!-- Edge labels -->
    <text x="150" y="155" text-anchor="middle" fill="#6e7681" font-size="10" font-family="sans-serif" font-style="italic">CP</text>
    <text x="75" y="240" text-anchor="middle" fill="#6e7681" font-size="10" font-family="sans-serif" font-style="italic">AP</text>
    <text x="230" y="130" text-anchor="middle" fill="#6e7681" font-size="10" font-family="sans-serif" font-style="italic">CA</text>

    <!-- Center text -->
    <text x="150" y="175" text-anchor="middle" fill="#8b949e" font-size="11" font-family="sans-serif">最多同时</text>
    <text x="150" y="190" text-anchor="middle" fill="#8b949e" font-size="11" font-family="sans-serif">满足两项</text>
  </g>

  <!-- Arrow from CAP to BASE -->
  <g transform="translate(560,250)">
    <path d="M0,0 L60,0" stroke="#30363d" stroke-width="2" marker-end="url(#arrowhead)"/>
    <text x="30" y="-8" text-anchor="middle" fill="#58a6ff" font-size="11" font-family="sans-serif">延伸</text>
  </g>

  <!-- BASE Box -->
  <g transform="translate(620,140)">
    <rect x="0" y="0" width="160" height="220" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
    <text x="80" y="30" text-anchor="middle" fill="#58a6ff" font-size="14" font-family="sans-serif" font-weight="bold">BASE 理论</text>
    <line x1="20" y1="42" x2="140" y2="42" stroke="#30363d" stroke-width="1"/>

    <text x="80" y="68" text-anchor="middle" fill="#3fb950" font-size="12" font-family="sans-serif" font-weight="bold">B</text>
    <text x="80" y="83" text-anchor="middle" fill="#8b949e" font-size="9" font-family="sans-serif">Basically Available</text>
    <text x="80" y="96" text-anchor="middle" fill="#6e7681" font-size="9" font-family="sans-serif">基本可用</text>

    <text x="80" y="122" text-anchor="middle" fill="#bc8cff" font-size="12" font-family="sans-serif" font-weight="bold">S</text>
    <text x="80" y="137" text-anchor="middle" fill="#8b949e" font-size="9" font-family="sans-serif">Soft State</text>
    <text x="80" y="150" text-anchor="middle" fill="#6e7681" font-size="9" font-family="sans-serif">软状态</text>

    <text x="80" y="176" text-anchor="middle" fill="#f78166" font-size="12" font-family="sans-serif" font-weight="bold">E</text>
    <text x="80" y="191" text-anchor="middle" fill="#8b949e" font-size="9" font-family="sans-serif">Eventual Consistency</text>
    <text x="80" y="204" text-anchor="middle" fill="#6e7681" font-size="9" font-family="sans-serif">最终一致性</text>
  </g>

  <!-- CP Systems -->
  <g transform="40,400">
    <rect x="0" y="0" width="200" height="140" rx="8" fill="#161b22" stroke="#f78166" stroke-width="1.5"/>
    <text x="100" y="25" text-anchor="middle" fill="#f78166" font-size="13" font-family="sans-serif" font-weight="bold">CP 系统</text>
    <line x1="15" y1="35" x2="185" y2="35" stroke="#30363d" stroke-width="1"/>
    <text x="20" y="55" fill="#c9d1d9" font-size="11" font-family="sans-serif">• HBase</text>
    <text x="20" y="75" fill="#c9d1d9" font-size="11" font-family="sans-serif">• MongoDB</text>
    <text x="20" y="95" fill="#c9d1d9" font-size="11" font-family="sans-serif">• ZooKeeper / Etcd</text>
    <text x="20" y="115" fill="#c9d1d9" font-size="11" font-family="sans-serif">• Redis Cluster</text>
    <text x="20" y="133" fill="#6e7681" font-size="9" font-family="sans-serif">强一致性 · 分区时拒绝写入</text>
  </g>

  <!-- AP Systems -->
  <g transform="280,400">
    <rect x="0" y="0" width="200" height="140" rx="8" fill="#161b22" stroke="#3fb950" stroke-width="1.5"/>
    <text x="100" y="25" text-anchor="middle" fill="#3fb950" font-size="13" font-family="sans-serif" font-weight="bold">AP 系统</text>
    <line x1="15" y1="35" x2="185" y2="35" stroke="#30363d" stroke-width="1"/>
    <text x="20" y="55" fill="#c9d1d9" font-size="11" font-family="sans-serif">• Cassandra</text>
    <text x="20" y="75" fill="#c9d1d9" font-size="11" font-family="sans-serif">• DynamoDB</text>
    <text x="20" y="95" fill="#c9d1d9" font-size="11" font-family="sans-serif">• CouchDB</text>
    <text x="20" y="115" fill="#c9d1d9" font-size="11" font-family="sans-serif">• Voldemort</text>
    <text x="20" y="133" fill="#6e7681" font-size="9" font-family="sans-serif">高可用 · 最终一致性</text>
  </g>

  <!-- Trade-off Summary -->
  <g transform="520,400">
    <rect x="0" y="0" width="240" height="140" rx="8" fill="#161b22" stroke="#58a6ff" stroke-width="1.5"/>
    <text x="120" y="25" text-anchor="middle" fill="#58a6ff" font-size="13" font-family="sans-serif" font-weight="bold">设计权衡</text>
    <line x1="15" y1="35" x2="225" y2="35" stroke="#30363d" stroke-width="1"/>
    <text x="20" y="58" fill="#c9d1d9" font-size="10.5" font-family="sans-serif">• 网络分区是分布式系统的必然</text>
    <text x="20" y="78" fill="#c9d1d9" font-size="10.5" font-family="sans-serif">• P 通常必选 → 实际是 C vs A</text>
    <text x="20" y="98" fill="#c9d1d9" font-size="10.5" font-family="sans-serif">• BASE 是 AP 的工程化延伸</text>
    <text x="20" y="118" fill="#c9d1d9" font-size="10.5" font-family="sans-serif">• 现代系统多为可调节一致性</text>
    <text x="20" y="135" fill="#6e7681" font-size="9" font-family="sans-serif">没有银弹，按场景选择</text>
  </g>

  <!-- Footer -->
  <text x="400" y="580" text-anchor="middle" fill="#6e7681" font-size="10" font-family="sans-serif">参考来源：《设计数据密集型应用》Martin Kleppmann · 《凤凰架构》周志明 · 阿里云技术博客</text>
</svg>
